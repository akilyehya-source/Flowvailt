<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowVault</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlowVault">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10141a">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0d1117;--ink:#10141a;--panel:#171c24;--card:#131820;--line:#262d38;--text:#e2e8f0;--mute:#94a3b8;--brass:#d4a85a;--sig:#5fd1c4;--onbrass:#10141a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f7;--ink:#fff;--panel:#fff;--card:#fafbfc;--line:#dde1e7;--text:#1b2230;--mute:#5b6678;--brass:#9a6b12;--sig:#0b7f74;--onbrass:#fff}}
:root[data-theme="dark"]{--bg:#0d1117}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);border-bottom:1px solid var(--line)}
.logo{font-weight:600;color:var(--brass)}
.search{flex:1;max-width:440px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--mute);text-align:left}
.search kbd{margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12px}
.state{font-size:12px;color:var(--sig);white-space:nowrap}
.btn{background:var(--brass);color:var(--onbrass);border:0;border-radius:9px;padding:7px 12px;font-weight:600;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--text);transition:background .15s}
.ghost:hover{background:var(--panel)}
main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
section,aside{overflow-y:auto;padding:20px}
aside{background:var(--ink);border-left:1px solid var(--line)}
h2{margin:0 0 14px;font-size:17px}aside h2{font-size:14px;margin:0}
ol{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px solid var(--line)}
li.b{position:relative;margin-bottom:14px}
li.b:before{content:"";position:absolute;left:-28px;top:16px;width:11px;height:11px;border-radius:50%;background:#3a4454}
li.b.active:before{background:var(--sig);box-shadow:0 0 0 4px color-mix(in srgb,var(--sig) 25%,transparent)}
li.b.completed:before{background:var(--brass)}
.blk{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;transition:border-color .15s}
.blk:hover{border-color:#3a4454}.blk.sel{border-color:var(--sig);background:var(--panel)}
.completed .blk{opacity:.6}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mute{color:var(--mute);font-size:12px}
.big{font-size:26px;font-weight:600;color:var(--sig);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px}
.link{background:none;border:0;padding:4px 0;font-size:12px;color:var(--sig)}.link.d{color:var(--brass)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateX(10px)}}
.card .acts{display:flex;gap:8px;margin-top:10px}.card .btn{flex:1}
.priv{transition:filter .2s}.blur .priv{filter:blur(6px);user-select:none}
.empty{color:var(--mute);margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:15vh;z-index:9}
.pal{width:min(520px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pal input{width:100%;background:none;border:0;padding:14px 16px;color:var(--text);font:inherit}
.pal button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:9px 16px;text-align:left}
.pal button.on{background:var(--panel)}
.toast{z-index:6;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .2s}
.lock{display:grid;place-items:center;height:100%;padding:20px}
.lock form{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.lock input{width:100%;margin:14px 0 10px;padding:10px 12px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit}
.err{color:#f08a8a;min-height:20px;font-size:13px}
.hud{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(640px,calc(100% - 24px));background:var(--panel);border:1px solid var(--sig);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:10px 14px;animation:in .2s;z-index:5}
.hud .r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hud .t{flex:1 1 120px;min-width:0}.hud .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-size:26px;font-weight:700;letter-spacing:.12em;color:var(--sig);background:none;border:0;padding:0}.wheel{width:36px;height:36px;flex:none}
.web{position:fixed;inset:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:in .2s}
.tabs{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--ink);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--card);white-space:nowrap}.tab.on{border-color:var(--sig)}.tab button{background:none;border:0;padding:5px 9px}
.bar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.bar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--text);font:inherit}
.wbody{flex:1;min-height:0;overflow-y:auto}.wbody iframe{width:100%;height:100%;border:0;background:#fff}
.wcard{max-width:460px;margin:8vh auto;padding:20px;text-align:center}.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px}
.wfoot{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
@media(max-width:760px){main{grid-template-columns:1fr;overflow-y:auto}aside{border-left:0;border-top:1px solid var(--line)}.search span{display:none}}
input{font-size:16px!important} /* iOS zooms the page when an input is smaller than 16px */
.nlist{padding:12px;display:grid;gap:10px}.ni{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.ni b{display:block}.ni p{margin:4px 0 0;color:var(--mute);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ned{display:flex;flex-direction:column;gap:10px;padding:12px;flex:1;min-height:0}.ned input,.ned select,.ned textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit}.ned textarea{flex:1;resize:none}
textarea,select{font-size:16px}
@media(max-width:760px){header{flex-wrap:wrap}.search{order:5;flex-basis:100%;max-width:none}}






/* ───────── Library: 3D shelves ───────── */
#lib{z-index:4}
#lib .tabs{gap:8px;flex-wrap:wrap;overflow:visible}#lib .tabs .btn,#lib .tabs .ghost{white-space:nowrap}#lib .tabs input[type=search]{flex:1 1 140px}#lib .tabs #lcount{margin-right:auto}
#lib .tabs input[type=search]{flex:1;min-width:90px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--text);font:inherit}
#lib select,#rd select{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:6px 8px;font:inherit;font-size:16px}
.room{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;perspective:1500px;perspective-origin:50% -35%;
 background:radial-gradient(ellipse 80% 50% at 50% 0,#4a3321 0,#24180f 55%,#120c07 100%);padding:34px 8px 70px;position:relative}
.rows,.shelf{pointer-events:none}.rows{transform-style:preserve-3d}
.shelf{position:relative;margin:0 auto 52px;height:212px;transform-style:preserve-3d}
.shelf .back{position:absolute;inset:0;transform:translateZ(-150px);background:
 linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,.45)),repeating-linear-gradient(90deg,#3a2616 0 22px,#33210f 22px 44px)}
.shelf .floor{position:absolute;left:0;right:0;bottom:0;height:150px;transform-origin:50% 100%;transform:rotateX(90deg);
 background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px),linear-gradient(#b07c4f,#8a5b36)}
.shelf .sl,.shelf .sr{position:absolute;top:0;width:150px;height:100%;background:linear-gradient(90deg,#2b1b0f,#4a3020)}
.shelf .sl{left:0;transform-origin:0 50%;transform:rotateY(90deg)}
.shelf .sr{right:0;transform-origin:100% 50%;transform:rotateY(-90deg);background:linear-gradient(270deg,#2b1b0f,#4a3020)}
.shelf .plank{position:absolute;left:-8px;right:-8px;bottom:-20px;height:20px;border-radius:2px;
 background:linear-gradient(#a5703f,#7a4c27 55%,#56331a);box-shadow:0 14px 22px rgba(0,0,0,.55)}
.books{position:absolute;left:16px;right:16px;bottom:0;display:flex;align-items:flex-end;gap:1px;transform-style:preserve-3d;pointer-events:none}.books .slot{pointer-events:auto}
.slot{transform-style:preserve-3d;transform:translateZ(calc(-14px - var(--d)/2));transition:transform .28s cubic-bezier(.2,.8,.3,1);cursor:pointer;
 background:none;border:0;padding:0;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.slot:hover,.slot.pull{transform:translateZ(calc(-14px - var(--d)/2 + 34px)) rotateY(-14deg)}
.slot:focus-visible{outline:2px solid var(--sig);outline-offset:6px}
.bk{position:relative;width:var(--t);height:var(--h);transform-style:preserve-3d}
.bk .f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk .sp{inset:0;transform:translateZ(calc(var(--d)/2));overflow:hidden;
 background:linear-gradient(90deg,var(--cd),var(--c) 22%,var(--cl) 48%,var(--c) 78%,var(--cd));color:var(--ink);border-radius:1px}
.bk .sp:before,.bk .sp:after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(240,214,150,.75)}
.bk .sp:before{top:9px}.bk .sp:after{bottom:12px}
.bk .sp span{position:absolute;inset:18px 0 20px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);
 font:600 calc(var(--t)*.34 + 2px)/1.15 Georgia,"Times New Roman",serif;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.bk .sp i{position:absolute;left:0;bottom:0;height:3px;background:#f0d696;opacity:.95}
.bk .bs{inset:0;transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:var(--cd)}
.bk .fc,.bk .bc{width:var(--d);height:var(--h);left:calc((var(--t) - var(--d))/2);top:0;background-color:var(--c);background-size:100% 100%;background-position:center}
.bk .fc{transform:rotateY(90deg) translateZ(calc(var(--t)/2))}
.bk .bc{transform:rotateY(-90deg) translateZ(calc(var(--t)/2));background:var(--cd)}
.bk .fc:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12) 6%,rgba(0,0,0,0) 14%)}
.bk .tp{width:var(--t);height:var(--d);left:0;top:calc((var(--h) - var(--d))/2);transform:rotateX(90deg) translateZ(calc(var(--h)/2));
 background:repeating-linear-gradient(0deg,#f1e7cf 0 1.5px,#d9cba8 1.5px 3px)}
.lempty{max-width:520px;margin:6vh auto 0;text-align:center;color:#d9c3a0;padding:0 20px}
.lempty b{display:block;font:600 20px Georgia,serif;margin-bottom:6px;color:#f0d696}
.lempty p{margin:0;color:#c9b08a;font-size:14px}
.bdet{position:absolute;inset:0;z-index:3;background:rgba(10,7,4,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;animation:in .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stage{perspective:1100px;height:min(330px,40vh);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;width:min(420px,100%)}
.stage .bk{transform-origin:50% 50%}
.stage .bk.spin{animation:spin 7s ease-in-out infinite alternate}
@keyframes spin{from{transform:rotateX(-8deg) rotateY(-62deg)}to{transform:rotateX(-8deg) rotateY(-18deg)}}
.bdet input.ttl{width:min(420px,100%);text-align:center;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.25);color:#f3e6c8;font:600 18px Georgia,serif;padding:6px}
.bdet .meta{color:#c9b08a;font-size:13px;text-align:center}
.bdet .bar2{width:min(260px,70%);height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}.bdet .bar2 i{display:block;height:100%;background:#f0d696}
.bdet .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw;animation:in .2s}
/* ───────── Reader ───────── */
#rd{z-index:6}
.rbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--ink);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.rbar .rt{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis}
.rbar .ghost{padding:6px 10px;flex:none}
.rbar .ghost.on{border-color:var(--sig);color:var(--sig)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;flex:none}.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.rsep{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}
.rscroll{flex:1;min-height:0;overflow:auto;background:#3a3f47;padding:10px 0 80px;-webkit-overflow-scrolling:touch}
.rscroll .pg{position:relative;margin:0 auto 10px;width:var(--pw);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.rscroll .pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rscroll.inv .pc{filter:invert(.92) hue-rotate(180deg)}
.rscroll .ac{pointer-events:none}.rscroll.tool .ac{pointer-events:auto;touch-action:none}.rscroll.tool.pen .ac{touch-action:pan-y pinch-zoom}
.rscroll.tool .ac{cursor:crosshair}
.rscroll .pn{position:absolute;right:6px;top:4px;font-size:11px;color:#8a919c;pointer-events:none}
.rscroll .ti{position:absolute;min-width:90px;background:rgba(255,255,255,.92);border:1px dashed #2a7;border-radius:4px;color:#111;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;padding:1px 3px;line-height:1.2;resize:none;overflow:hidden;z-index:2}
.rmenu{position:absolute;right:8px;top:calc(100px + env(safe-area-inset-top,0px));z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px;min-width:230px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.rmenu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}
.rmenu button:hover{background:var(--card)}
.rsrch{position:absolute;left:0;right:0;bottom:0;max-height:55%;z-index:3;background:var(--ink);border-top:1px solid var(--line);display:flex;flex-direction:column;animation:in .2s}
.rsrch form{display:flex;gap:8px;padding:10px}.rsrch input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--text);font:inherit}
.rsrch ul{list-style:none;margin:0;padding:0 10px 10px;overflow:auto}
.rsrch li button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 4px}
.rsrch li b{color:var(--sig);margin-right:8px}
.rgo{display:flex;gap:8px;padding:8px 10px;background:var(--ink);border-bottom:1px solid var(--line)}.rgo input{width:90px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--text);font:inherit}
@media(max-width:760px){.rbar .lbl{display:none}.rbar{gap:4px;padding:6px}.rbar .ghost{padding:6px 9px}}
@media(prefers-reduced-motion:reduce){.stage .bk.spin{animation:none;transform:rotateY(-40deg)}.slot{transition:none}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ───────── Relax: Mochi's room ───────── */
#rx{z-index:4}
.rxbars{display:flex;gap:10px;padding:8px 12px;background:var(--ink);border-bottom:1px solid var(--line)}
.rxbars label{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);min-width:0}
.rxbars i{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.rxbars b{display:block;height:100%;width:0;background:var(--sig);border-radius:4px;transition:width .3s}
.rxbars label:nth-child(2) b{background:var(--brass)}.rxbars label:nth-child(3) b{background:#ff7fae}
.rxbars span{display:none}
@media(min-width:520px){.rxbars span{display:inline}}
#rxmood{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rxstage{flex:1;min-height:0;position:relative;background:#232b52;display:flex;justify-content:center}
.rxstage svg{width:100%;height:100%;max-width:640px;display:block;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.rxtoast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rxbar{display:flex;gap:5px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--ink);border-top:1px solid var(--line);overflow-x:auto}
.rxbar .ghost{padding:9px 9px;white-space:nowrap;flex:none;font-size:14px}
.rxbar .ghost.on{border-color:var(--sig);color:var(--sig)}
nav.tools{display:contents}
@media(max-width:760px){nav.tools{order:6;flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}nav.tools .ghost{flex:none}}

/* ───────── Music ───────── */
#mu{z-index:4}
.mnow{display:grid;gap:12px;justify-items:center;padding:18px 16px 10px;background:var(--ink);border-bottom:1px solid var(--line)}
.mart{width:min(150px,36vw);aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:44px;color:rgba(255,255,255,.85);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.mti{display:grid;text-align:center;gap:2px;max-width:100%;min-width:0}.mti b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mti span{font-size:13px}
.mseek{display:flex;align-items:center;gap:8px;width:min(460px,100%);font-size:12px;color:var(--mute)}
.mseek input{flex:1;min-width:0;accent-color:var(--sig)}
.mctl{display:flex;align-items:center;gap:8px}
.mctl .ghost{padding:9px 12px;font-size:16px}.mctl .ghost.on{border-color:var(--sig);color:var(--sig)}
.mplay{width:56px;height:56px;border-radius:50%;padding:0;font-size:22px;display:grid;place-items:center}
.mfocus{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.mlist{flex:1;min-height:0;overflow-y:auto;padding:6px 0 80px;-webkit-overflow-scrolling:touch}
.mrow{display:flex;align-items:center;gap:6px;padding:2px 10px;border-bottom:1px solid var(--line)}
.mrow.cur{background:var(--panel)}
.mpick,.mbo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:8px 4px;text-align:left;color:inherit}

.gate{--sig:#5fd1c4;--brass:#d4a85a;grid-template-columns:minmax(0,1fr);position:relative;height:100%;min-height:100dvh;display:grid;place-items:center;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:hidden;color:#e8eef8;background:radial-gradient(ellipse 80% 60% at 50% 30%,#0f2030 0,#0a111c 55%,#060a11 100%);transition:transform .4s cubic-bezier(.5,0,.2,1) .45s,opacity .33s ease .5s;box-sizing:border-box}
.gate.ok{transform:scale(1.22);opacity:0}
.gpart{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gaur{position:absolute;inset:-20%;pointer-events:none;background:conic-gradient(from 200deg at 50% 38%,rgba(95,209,196,.0),rgba(95,209,196,.14),rgba(212,168,90,.1),rgba(95,209,196,0) 70%);filter:blur(60px);animation:gaur 22s linear infinite;opacity:.9}

.gword{font-size:12px;letter-spacing:.5em;font-weight:600;color:#8fb7b3;margin-bottom:6px;padding-left:.5em;animation:gup .7s both}
.gstage{perspective:900px;width:min(300px,74vw,40dvh);aspect-ratio:1;margin:4px 0 6px;--tx:0deg;--ty:0deg}

.gcore{animation:gbreath 4s ease-in-out infinite}
@keyframes gbreath{50%{opacity:.55;transform:scale(1.04)}}
.gt{stroke:#37506a;stroke-width:2.2;stroke-linecap:round;opacity:0;animation:gtin .4s var(--d) forwards;transition:stroke .25s}
@keyframes gtin{to{opacity:.55}}
.gt.on{stroke:var(--c,#5fd1c4);opacity:1;stroke-width:3.2;filter:drop-shadow(0 0 4px var(--c,#5fd1c4))}
.gr2{stroke:rgba(95,209,196,.28);stroke-width:1.2;stroke-dasharray:46 20 8 20;animation:gspin 26s linear infinite}
.gr3{animation:gspin 14s linear reverse infinite}.gr3c{stroke:rgba(255,255,255,.07);stroke-width:1}
.gr3a{fill:none;stroke:rgba(212,168,90,.7);stroke-width:2.4;stroke-linecap:round}
.gdial.tap .gr3{animation-duration:3s}
@keyframes gspin{to{transform:rotate(360deg)}}
.giris{transform:rotate(var(--rot));transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.gb{transform:rotate(var(--a)) translateX(0);transition:transform .7s cubic-bezier(.6,0,.2,1) .25s,opacity .5s ease .45s;transform-origin:0 0;animation:gbin .8s both}
.gb path:first-child{fill:url(#gblade);stroke:rgba(255,255,255,.06);stroke-width:1}
.gbe{fill:none;stroke:rgba(95,209,196,.55);stroke-width:1.4;stroke-linecap:round}
@keyframes gbin{from{transform:rotate(var(--a)) translateX(60px) scale(.6);opacity:0}}
.glb{fill:#0c1420;stroke:rgba(95,209,196,.55);stroke-width:1.6;filter:drop-shadow(0 0 10px rgba(95,209,196,.35))}
.glock{animation:gpulse 3.4s ease-in-out infinite}
@keyframes gpulse{50%{filter:drop-shadow(0 0 6px rgba(95,209,196,.5))}}
.gbody{fill:#d4a85a}.gshack{fill:none;stroke:#e8eef8;stroke-width:4.6;stroke-linecap:round;transform-origin:12px -4px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.gkey{fill:#0c1420}.gkey2{stroke:#0c1420;stroke-width:3;stroke-linecap:round}
/* typing */
.gdial.tap .glb{animation:gtap .25s}
@keyframes gtap{40%{stroke:#fff}}
/* busy */
.gate.busy .gr2{animation-duration:2s}.gate.busy .gr3{animation-duration:1.2s}
.gate.busy .gt.on{animation:gscan 1s linear infinite}
@keyframes gscan{50%{opacity:.35}}
/* success */
.gate.ok .gshack{transform:translateY(-6px) rotate(-38deg)}
.gate.ok .gb{transform:rotate(var(--a)) translateX(95px);opacity:0}
.gate.ok .gbody{fill:#7dffb0}.gate.ok .glb{stroke:#7dffb0}
.gate.ok .gcore{animation:none;opacity:1;transform:scale(1.5);transition:transform .6s,opacity .6s}
.gate.ok .gr2,.gate.ok .gr3{animation-duration:1.2s}
.gate.ok .gform>*:not(.gstage){opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
/* fail */
.gate.bad .gstage{animation:gshake .55s}
.gate.bad .glb{stroke:#ff6b5e}.gate.bad .gbody{fill:#ff6b5e}.gate.bad .gcore{filter:hue-rotate(150deg)}
@keyframes gshake{15%,55%{transform:translateX(-12px)}35%,75%{transform:translateX(12px)}95%{transform:translateX(-4px)}}
/* text and field */

.geye svg{width:21px;height:21px;fill:none;stroke:#8d9bb0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.geye .gslash{opacity:1}.geye.on .gslash{opacity:0}.geye.on svg{stroke:var(--sig)}
.gbtn{width:46px;height:46px;border-radius:50%;border:0;flex:none;padding:0;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#5fd1c4,#d4a85a);color:#0b1119;box-shadow:0 6px 20px rgba(95,209,196,.3);transition:transform .15s,filter .2s}
.gbtn:active{transform:scale(.92)}.gbtn:disabled{filter:saturate(.6) brightness(.85)}
.garrow{width:22px;height:22px;fill:none;stroke:#0b1119;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.gspin{position:absolute;inset:9px;border-radius:50%;border:3px solid rgba(11,17,25,.25);border-top-color:#0b1119;display:none;animation:gspin .7s linear infinite}
.gate.busy .gspin{display:block}.gate.busy .garrow{display:none}
.gstr{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%;margin-top:10px;padding:0 10px;box-sizing:border-box}

.gchip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:5px 11px;background:rgba(255,255,255,.03)}

.bx{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.bx>i{position:absolute;background-color:var(--c);backface-visibility:hidden;-webkit-backface-visibility:hidden;
 background-image:var(--fi,linear-gradient(#0000,#0000)),linear-gradient(rgba(0,0,0,calc(var(--dk) + var(--sh,0))),rgba(0,0,0,calc(var(--dk) + var(--sh,0))))}
.bx>.f{--sh:.1;width:var(--w);height:var(--h);left:calc(var(--w)/-2);top:calc(var(--h)/-2);transform:translateZ(calc(var(--d)/2))}
.bx>.k{--sh:.4;width:var(--w);height:var(--h);left:calc(var(--w)/-2);top:calc(var(--h)/-2);transform:rotateY(180deg) translateZ(calc(var(--d)/2))}
.bx>.l{--sh:.3;width:var(--d);height:var(--h);left:calc(var(--d)/-2);top:calc(var(--h)/-2);transform:rotateY(-90deg) translateZ(calc(var(--w)/2))}
.bx>.r{--sh:.22;width:var(--d);height:var(--h);left:calc(var(--d)/-2);top:calc(var(--h)/-2);transform:rotateY(90deg) translateZ(calc(var(--w)/2))}
.bx>.t{--sh:0;width:var(--w);height:var(--d);left:calc(var(--w)/-2);top:calc(var(--d)/-2);transform:rotateX(90deg) translateZ(calc(var(--h)/2))}
/* room shell */
.wb{background:repeating-linear-gradient(90deg,#2b3649 0 26px,#2f3a4e 26px 52px)}
.wb:before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#212b3b,#1a2330);border-top:4px solid #c9b48a}
.wb:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:#d9cfb8}
.ws{background:linear-gradient(90deg,#222c3d,#2c3749)}
.ws.r{background:linear-gradient(270deg,#222c3d,#2c3749)}
.ws:before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:rgba(0,0,0,.18);border-top:4px solid #c9b48a}
.ws:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:#d9cfb8}
.fl{background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 30px),repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 1px,transparent 1px 90px),linear-gradient(#a06f45,#8a5c36)}
.cl{background:#1b2230}
.rug{background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px),radial-gradient(ellipse at 50% 50%,#8a3f46 0,#6f2f38 62%,#5a2530 100%);box-shadow:inset 0 0 0 7px #d8c28f,inset 0 0 0 10px #6f2f38,inset 0 0 0 12px #d8c28f}
.win{position:absolute;left:92px;top:42px;width:150px;height:128px;border:7px solid #d9cfb8;border-radius:3px;box-shadow:0 0 30px rgba(120,160,255,.25);overflow:hidden;
 background:radial-gradient(circle at 74% 26%,#fff 0,#f4f1d8 7px,rgba(244,241,216,.25) 16px,transparent 30px),radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 55% 18%,#fff,transparent),radial-gradient(1px 1px at 38% 62%,#fff,transparent),radial-gradient(1px 1px at 85% 70%,#fff,transparent),radial-gradient(1px 1px at 12% 80%,#fff,transparent),linear-gradient(#0a1230,#1d3566 70%,#2d4a7e)}
.win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px;background:#d9cfb8}
.win:after{content:"";position:absolute;top:50%;left:0;right:0;height:5px;margin-top:-2.5px;background:#d9cfb8}
.crt{position:absolute;top:30px;width:34px;height:146px;background:repeating-linear-gradient(90deg,#8a3f46 0 6px,#74323a 6px 12px);border-radius:0 0 12px 12px;box-shadow:0 8px 12px rgba(0,0,0,.4)}
.frm{position:absolute;background:#c9b48a;padding:4px;box-shadow:0 5px 10px rgba(0,0,0,.45)}
.frm i{display:block;width:100%;height:100%}
.amb,.fglow{position:absolute;left:calc(var(--w)/-2);top:calc(var(--h)/-2);width:var(--w);height:var(--h);pointer-events:none;opacity:0;transition:opacity 1s}
.amb{background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(var(--amb,90,140,255),.6),rgba(var(--amb,90,140,255),0) 100%)}
.fglow{background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(var(--amb,90,140,255),.5),rgba(var(--amb,90,140,255),0) 100%)}
.rm.on .amb,.rm.on .fglow{opacity:1}
.lampglow{position:absolute;left:calc(var(--w)/-2);top:calc(var(--h)/-2);width:var(--w);height:var(--h);background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(255,196,110,.5),rgba(255,196,110,0) 100%);pointer-events:none}
.shade{box-shadow:0 0 18px 4px rgba(255,190,100,.55)}
.drawers{--fi:linear-gradient(90deg,transparent 0 49.4%,rgba(0,0,0,.4) 49.4% 50.6%,transparent 50.6%),radial-gradient(circle at 25% 50%,#d9c08a 0 3px,transparent 4px),radial-gradient(circle at 75% 50%,#d9c08a 0 3px,transparent 4px)}
.cush{--fi:linear-gradient(90deg,transparent 0 49%,rgba(0,0,0,.35) 49% 51%,transparent 51%)}
.back{--fi:repeating-linear-gradient(90deg,transparent 0 69px,rgba(0,0,0,.3) 69px 71px)}
/* TV */
.tvf{position:absolute;left:calc(var(--w)/-2);top:calc(var(--h)/-2);width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/2 + .6px));background:#06080c;border-radius:4px;box-shadow:inset 0 0 0 1px #2a313d}
.tvf .scr{position:absolute;inset:7px 7px 12px;background:#000;overflow:hidden;border-radius:2px;cursor:pointer}
.tvf .scr video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.tvf .scr:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),rgba(255,255,255,0) 32%);pointer-events:none}
.tvf .led{position:absolute;right:12px;bottom:4px;width:4px;height:4px;border-radius:50%;background:#e33;box-shadow:0 0 5px #e33}
.rm.on .tvf .led{background:#3e6;box-shadow:0 0 5px #3e6}
.tvf .brand{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font:600 6px system-ui;letter-spacing:.3em;color:#7b8594}
.nosig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;color:#fff;font:600 10px system-ui;
 background:linear-gradient(90deg,#c0c0c0 0 14.28%,#c0c000 0 28.56%,#00c0c0 0 42.84%,#00c000 0 57.12%,#c000c0 0 71.4%,#c00000 0 85.68%,#0000c0 0) top/100% 70% no-repeat,linear-gradient(90deg,#0000c0 0 14.28%,#111 0 28.56%,#c000c0 0 42.84%,#111 0 57.12%,#00c0c0 0 71.4%,#111 0 85.68%,#c0c0c0 0) bottom/100% 10% no-repeat,#10131a}
.nosig span{background:rgba(0,0,0,.72);padding:4px 8px;border-radius:6px}
.scr .ppl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.25);pointer-events:none}
.scr .ppl svg{width:34px;height:34px;fill:#fff;opacity:.9;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.rm.paused .scr .ppl{display:flex}
/* hints, buttons over scene */
.tvhint{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:12px;color:#8d9bb0;pointer-events:none;transition:opacity .6s}
.tvhint.off{opacity:0}
.tvfab{position:absolute;right:10px;top:10px;display:grid;gap:8px;z-index:2}
.tvfab button{width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(20,27,40,.82);border:1px solid var(--line);color:var(--text);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tvfab button.on{border-color:var(--sig);color:var(--sig)}
/* remote */
.tvrem{background:var(--ink);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;position:relative;z-index:3}
.tvnow{display:flex;flex-direction:column;min-width:0;text-align:center}
.tvnow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tvnow small{color:var(--mute);font-size:12px}
.tvseek{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tvseek input,.fsc input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0}
.tvseek input::-webkit-slider-runnable-track,.fsc input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--sig) var(--p,0%),rgba(255,255,255,.2) var(--p,0%))}
.tvseek input::-webkit-slider-thumb,.fsc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.tvseek input::-moz-range-track,.fsc input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.tvseek input::-moz-range-progress,.fsc input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--sig)}
.tvseek input::-moz-range-thumb,.fsc input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.tvbtns{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tvbtns button{background:none;border:0;color:var(--text);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0}
.tvbtns button:active{background:rgba(255,255,255,.1)}
.tvbtns .tvplay{background:var(--sig);color:#05211e;width:54px;height:54px}
.tvbtns .tvplay:active{background:var(--sig);filter:brightness(.9)}
.tvbtns .tvplay svg,.tvbtns .tvfull svg{width:24px;height:24px}
.tvbtns .tvfull{background:rgba(95,209,196,.14);color:var(--sig);border:1px solid rgba(95,209,196,.5);width:auto;padding:0 14px 0 12px;display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px}
.tvbtns .tvfull svg{width:20px;height:20px}
.tvbtns button.on{color:var(--sig)}
/* playlist sheet */
.tvlist{position:absolute;left:0;right:0;bottom:0;max-height:72%;z-index:4;background:var(--ink);border-top:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -14px 40px rgba(0,0,0,.55);animation:in .2s}
.tvlist header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.tvlist header b{flex:1}.tvlist header small{color:var(--mute);font-weight:400;margin-left:6px}
.tvlist .rows2{overflow:auto;padding:0 10px 14px;display:grid;gap:6px;-webkit-overflow-scrolling:touch}
.tvrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
.tvrow.cur{border-color:var(--sig)}
.tvpick{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;text-align:left;color:inherit;padding:0;font:inherit}
.tvth{position:relative;width:84px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000 center/cover no-repeat;flex:none;display:grid;place-items:center;color:#fff}
.tvth svg{width:22px;height:22px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.tvth em{position:absolute;right:3px;bottom:3px;font:600 10px system-ui;font-style:normal;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:4px}
.tvth u{position:absolute;left:0;bottom:0;height:3px;background:var(--sig)}
.tvpick span{display:flex;flex-direction:column;min-width:0}
.tvpick b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tvpick small{color:var(--mute);font-size:12px}
.tvrow .ghost{padding:6px 10px}.tvrow .d{color:#ff8a8a;border-color:#7a3a3a}
.tvempty{padding:26px 18px 30px;text-align:center;color:var(--mute)}
.tvempty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
/* full screen */
#tvfs{position:fixed;inset:0;z-index:8;background:#000;overflow:hidden;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#tvfs .fsin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--fw);height:var(--fh);background:#000;overflow:hidden}
#tvfs .fsin.rot{transform:translate(-50%,-50%) rotate(90deg)}
#tvfs .fsv{position:absolute;inset:0}
#tvfs video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.fsc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s;background:linear-gradient(rgba(0,0,0,.62),transparent 22%,transparent 62%,rgba(0,0,0,.7))}
.fsc.hide{opacity:0;pointer-events:none}
.fsc .top,.fsc .bot{padding:12px 14px;display:flex;align-items:center;gap:8px}
.fsc .top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.fsin.rot .fsc .top{padding-top:12px}
.fsc .bot{flex-direction:column;align-items:stretch;gap:2px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.fsin.rot .fsc .bot{padding-bottom:12px}
.fsc .top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.fsc button{background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fsc button.on{background:rgba(95,209,196,.35);color:#9ff0e6}
.fsc .row{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.fsc .row.btns{justify-content:center;gap:14px}
.fsc .big{width:58px;height:58px;background:rgba(255,255,255,.22)}
.fsc .big svg{width:26px;height:26px}
.fsflash{position:absolute;top:50%;transform:translateY(-50%);width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);display:none;place-items:center;font:600 13px system-ui;pointer-events:none}
.fsflash.show{display:grid;animation:fsf .5s}
@keyframes fsf{from{opacity:1}to{opacity:0}}
@media(prefers-reduced-motion:reduce){.rm,.rm.glide{transition:none}.fsc{transition:none}}
#tv .tvtop h2{white-space:nowrap}.tvbtns .tvfull span{white-space:nowrap}
@media(max-width:360px){#tv .tvtop .lbl{display:none}.tvbtns .tvfull{padding:0 10px}.tvbtns button{width:40px}}

#tvconv{position:absolute;inset:0;z-index:7;background:rgba(5,8,14,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
#tvconv .cc{width:min(340px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:grid;gap:10px;justify-items:center;text-align:center}
#tvconv .cc span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:13px}
#tvconv .cs{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--sig);animation:gspin .8s linear infinite}
#tvconv .cb{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#tvconv .cb i{display:block;height:100%;background:var(--sig);transition:width .3s}
#tvconv small{color:var(--mute)}

const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
/* ── crypto: same scheme as crypto.ts (PBKDF2-SHA256 600k → AES-GCM 256) ── */
async function deriveKey(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw.normalize('NFKC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(t,k){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(t));return{ciphertext:b64(new Uint8Array(c)),iv:b64(iv)}}
async function decryptData(c,iv,k){return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(c)))}
/* ── demo data ── */
const SEED=[
{id:'gh',t:'GitHub',c:'app',u:'dev@flowvault.demo',p:'demo-gh-Pass#1',url:'https://github.com',tags:['code'],totp:'JBSWY3DPEHPK3PXP'},
{id:'mail',t:'Work email',c:'email',u:'me@flowvault.demo',p:'demo-mail-Pass#2',url:'https://mail.google.com',tags:['inbox'],totp:'MFRGGZDFMZTWQ2LKNNWG23TP'},
{id:'stripe',t:'Stripe API key',c:'api_key',u:'sk_test_demo',p:'sk_test_DEMO_not_real',url:'https://dashboard.stripe.com',tags:['billing'],totp:'GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ'},
{id:'prod',t:'Prod server',c:'server',u:'deploy@10.0.0.7',p:'demo-ssh-Pass#4',url:null,tags:['ops']}];
const day=h=>{const d=new Date();d.setHours(h,0,0,0);return d.toISOString()};
let blocks=[
{id:'b1',title:'Ship billing fix',min:45,at:day(9),startedAt:null,status:'pending',ids:['gh','stripe'],primary:'gh'},
{id:'b2',title:'Inbox to zero',min:45,at:day(10),startedAt:null,status:'pending',ids:['mail'],primary:'mail'},
{id:'b3',title:'Patch production',min:45,at:day(11),startedAt:null,status:'pending',ids:['prod','gh'],primary:'prod'}];

try{vault=JSON.parse(localStorage.getItem(KEY))}catch{}
const saveVault=()=>{try{localStorage.setItem(KEY,JSON.stringify(vault))}catch{}};

const LOCK_SEC=120;

function showLock(msg=''){
 if(window.libReset)libReset();if(window.relaxReset)relaxReset();if(window.musicReset)musicReset();if(window.memReset)memReset();if(window.aiReset)aiReset();if(window.tvReset)tvReset();
 key=null;users={};palette=null;clipWipe();session=null;drawHud();web=null;drawWeb();notes=[];noteUI=null;drawNotes();
 const first=!vault;
 if(window.lockMarkup)root.innerHTML=lockMarkup(first,msg,`v16 · ${standalone?'installed app mode':'browser mode'}`);else root.innerHTML=`<div class="lock"><form id="f"><div class="logo" style="font-size:18px">FlowVault</div>
 <p class="mute" style="margin:6px 0 0">${first?'Create a master password for this demo vault. Everything is encrypted in your browser before it is stored.':'Enter your master password to unlock.'}</p>
 <input id="pw" type="password" autocomplete="off" placeholder="Master password" aria-label="Master password" autofocus>
 <div class="err" id="err">${esc(msg)}</div>
 <button class="btn" style="width:100%" id="go">${first?'Create vault':'Unlock'}</button>
 ${first?'':'<p class="mute" style="text-align:center;margin:14px 0 0"><button type="button" class="link" id="reset">Forgot it? Reset demo vault</button></p>'}<p class="mute" style="text-align:center;margin:10px 0 0;font-size:11px">v16 · ${standalone?'installed app mode':'browser mode'}</p></form></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;if(pw.length<4){$('#err').textContent='Use at least 4 characters.';return}
  if(window.lockBusy)lockBusy();else{$('#go').disabled=true;$('#go').textContent='Deriving key…'}
  try{await unlock(pw)}catch{if(window.lockFail&&$('.gate'))lockFail('Wrong master password.');else showLock('Wrong master password.')}};
 const r=$('#reset');if(r)r.onclick=()=>{vault=null;try{localStorage.removeItem(KEY);indexedDB.deleteDatabase('flowvault-lib')}catch{}showLock()};
 if(window.lockInit)lockInit();
}
async function unlock(pw){
 let k;
 if(!vault){
  const salt=crypto.getRandomValues(new Uint8Array(16));k=await deriveKey(pw,salt);
  const verifier=await encryptData('flowvault:verifier:v1',k),items=[];
  for(const s of SEED){const e=await encryptData(JSON.stringify({username:s.u,password:s.p}),k);const tt=s.totp?await encryptData(s.totp,k):null;items.push({id:s.id,title:s.t,category:s.c,ct:e.ciphertext,iv:e.iv,url:s.url,tags:s.tags,tct:tt&&tt.ciphertext,tiv:tt&&tt.iv})}
  vault={salt:b64(salt),verifier,items};saveVault();
 }else{
  k=await deriveKey(pw,unb64(vault.salt));
  if(await decryptData(vault.verifier.ciphertext,vault.verifier.iv,k)!=='flowvault:verifier:v1')throw 0;
 }
 for(const i of vault.items)users[i.id]=JSON.parse(await decryptData(i.ct,i.iv,k)).username;
 let ch=0;for(const s of SEED){const i=vault.items.find(x=>x.id===s.id);if(s.totp&&i&&!i.tct){const e=await encryptData(s.totp,k);i.tct=e.ciphertext;i.tiv=e.iv;ch=1}}if(ch)saveVault();
 notes=[];for(const n of vault.notes||[]){try{notes.push({...JSON.parse(await decryptData(n.ct,n.iv,k)),id:n.id,at:n.at,block:n.block})}catch{}}
 if(window.lockSuccess)await lockSuccess();
 key=k;last=Date.now();render();
}

function drawPalette(){

/* ── TOTP (RFC 6238, HMAC-SHA1 via Web Crypto) ── */
function b32(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const c of s.replace(/=+$/,'').toUpperCase())bits+=A.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)}
async function totp(secret,t=Date.now()){const c=Math.floor(t/30000),buf=new ArrayBuffer(8),dv=new DataView(buf);dv.setUint32(0,Math.floor(c/2**32));dv.setUint32(4,c>>>0);

 return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,'0')}
/* ── one-click workspace launch + session HUD ── */
async function launchWorkspace(id){

 ${session.open?(session.secret?`<svg class="wheel" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="hw" cx="18" cy="18" r="15" fill="none" stroke="var(--sig)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.25" transform="rotate(-90 18 18)"/></svg><button class="code tn" id="hc" data-a="ccopy" title="Copy code">------</button>`:'<span class="mute">No 2FA secret on these credentials</span>'):''}

async function hudTick(){

 if(!session.open||!session.secret)return;
 const now=Date.now(),s=30-Math.floor(now/1000)%30,c=await totp(session.secret,now);session.code=c;

}

/* ── in-app browser: tabs inside the page (no Safari) ── */
const BLOCKED=/(^|\.)(google\.com|youtube\.com|youtu\.be|github\.com|stripe\.com|outlook\.com|office\.com|reddit\.com|netflix\.com|whatsapp\.com|tiktok\.com|openai\.com|claude\.ai|anthropic\.com|discord\.com|notion\.so|slack\.com|dropbox\.com|spotify\.com|bing\.com|yahoo\.com|facebook\.com|instagram\.com|x\.com|twitter\.com|linkedin\.com|microsoft\.com|live\.com|apple\.com|amazon\.com|paypal\.com)$/i;
const hostOf=u=>{try{return new URL(u).hostname}catch{return''}};
const webCur=()=>web&&web.tabs.find(t=>t.id===web.active);
function normalize(q){q=q.trim();if(!q)return null;let u=q;if(!/^https?:\/\//i.test(q))u=/^\S+\.[a-z]{2,}(\/\S*)?$/i.test(q)?'https://'+q:'https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(q);try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}}
function openWeb(url,focus=true){web=web||{tabs:[],active:null,show:true};const t={id:'t'+(++tabN),url};web.tabs.push(t);if(focus||!web.active)web.active=t.id;web.show=true;drawWeb()}

 :BLOCKED.test(h)?`<div class="wcard"><h2>${esc(h)} can't be shown inside another page</h2><p class="mute">Large sites refuse to be embedded, for security. In the installed iPhone/Android app this opens in the built-in browser sheet instead.</p><button class="btn" data-a="wext">Open in browser</button></div>`
 :`<iframe src="${esc(c.url)}" sandbox="allow-scripts allow-forms allow-same-origin allow-popups" referrerpolicy="no-referrer" title="${esc(h)}"></iframe>`;
 w.innerHTML=`<div class="tabs">${web.tabs.map(t=>`<span class="tab ${t.id===web.active?'on':''}"><button data-a="wtab" data-id="${t.id}">${esc(t.url?hostOf(t.url):'New tab')}</button><button data-a="wx" data-id="${t.id}" aria-label="Close tab">×</button></span>`).join('')}<button class="ghost" data-a="wnew" aria-label="New tab">+</button><button class="ghost" data-a="wclose" style="margin-left:auto">Done</button></div>

 <div class="wbody">${body}</div>${c.url&&!BLOCKED.test(h)?'<div class="wfoot">Blank page? Some sites refuse to be embedded. <button class="link" data-a="wext">Open in browser</button></div>':''}`;
}

/* ── encrypted notes: title and body are encrypted with the vault key ── */
const noteTitle=n=>n.title||(n.body||'').split('\n')[0]||'Untitled';
function openNotes(){noteUI={mode:'list',q:''};drawNotes()}
function newNote(block){noteUI={mode:'edit',id:null,q:'',block:block||null};drawNotes()}
async function saveNote(n){
 const e=await encryptData(JSON.stringify({title:n.title,body:n.body}),key);
 const id=n.id||('n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),at=Date.now();

 notes=notes.filter(x=>x.id!==id);notes.push({id,title:n.title,body:n.body,at,block:n.block||null});return id}
async function deleteNote(id){vault.notes=(vault.notes||[]).filter(x=>x.id!==id);saveVault();notes=notes.filter(x=>x.id!==id)}
async function flushDraft(){

function fillNoteList(){
 const q=(noteUI.q||'').toLowerCase(),el=$('#nlist');if(!el)return;
 const list=notes.filter(n=>!q||(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>b.at-a.at);
 el.innerHTML=list.length?list.map(n=>{const b=blocks.find(x=>x.id===n.block);return`<button class="ni" data-a="nopen" data-id="${n.id}"><b class="priv">${esc(noteTitle(n))}</b><p class="priv">${esc((n.body||'').slice(0,160))}</p><div class="mute" style="margin-top:6px">${new Date(n.at).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}${b?' · '+esc(b.title):''}</div></button>`}).join(''):'<p class="mute">No notes yet. Tap + New to write one.</p>'}
function drawNotes(){

 if(!w){w=document.createElement('div');w.id='nt';w.setAttribute('role','dialog');w.setAttribute('aria-label','Notes');document.body.append(w)}

  <div class="ned"><input id="nti" value="${esc(n.title)}" placeholder="Title" aria-label="Title" autocomplete="off"><textarea id="ntb" placeholder="Write your note. It is encrypted on this device." aria-label="Note">${esc(n.body)}</textarea>
  <select id="ntl" aria-label="Link to block"><option value="">Not linked to a block</option>${blocks.map(b=>`<option value="${b.id}" ${n.block===b.id?'selected':''}>${esc(b.title)}</option>`).join('')}</select></div>`;
  if(!noteUI.id&&!n.title&&!n.body)$('#nti').focus();

<script>
/* ───────── FlowVault Library: 3D shelves, encrypted PDF storage, reader and annotation tools ───────── */
(()=>{
'use strict';
const CDN='https://cdnjs.cloudflare.com/ajax/libs/';
const L={books:[],q:'',sort:'added',cur:null,libsP:null,dbP:null,penOnly:false,inv:false,open:false,detail:null};
const COLORS=['#ffd84d','#ff6b6b','#5fe08f','#5aa9ff','#1f1f1f'];
const q$=(s,r=document)=>r.querySelector(s);
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function msg(t,ms=3200){const m=document.createElement('div');m.className='msg';m.setAttribute('role','status');m.textContent=t;document.body.append(m);setTimeout(()=>m.remove(),ms)}

/* ── encrypted storage (IndexedDB). Every record is AES-GCM encrypted with the vault key. ── */
const db=()=>L.dbP||(L.dbP=new Promise((ok,no)=>{const r=indexedDB.open('flowvault-lib',1);r.onupgradeneeded=()=>{for(const s of ['meta','data','ann'])r.result.createObjectStore(s)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
const idbGet=async(s,k)=>rq((await db()).transaction(s).objectStore(s).get(k));
const idbPut=async(s,k,v)=>{const t=(await db()).transaction(s,'readwrite');t.objectStore(s).put(v,k);return done(t)};
const idbDel=async k=>{const t=(await db()).transaction(['meta','data','ann'],'readwrite');for(const s of ['meta','data','ann'])t.objectStore(s).delete(k);return done(t)};
const idbAll=async s=>{const st=(await db()).transaction(s).objectStore(s);const [ks,vs]=await Promise.all([rq(st.getAllKeys()),rq(st.getAll())]);return ks.map((k,i)=>({k,v:vs[i]}))};
const encB=async b=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,b)}};
const decB=r=>crypto.subtle.decrypt({name:'AES-GCM',iv:r.iv},key,r.ct);
const encJ=o=>encB(enc.encode(JSON.stringify(o)));
const decJ=async r=>JSON.parse(dec.decode(await decB(r)));
const saveMeta=async b=>idbPut('meta',b.id,await encJ(b));
async function loadBooks(){
 const rows=await idbAll('meta'),out=[];
 for(const r of rows){try{out.push(await decJ(r.v))}catch{}}
 L.books=out;

/* ── PDF libraries: loaded on first use, from this site first, then a CDN ── */
function loadScript(srcs){return new Promise((ok,no)=>{let i=0;const next=()=>{if(i>=srcs.length)return no(new Error('Could not load '+srcs[0]));const s=document.createElement('script');s.src=srcs[i++];s.onload=()=>ok();s.onerror=()=>{s.remove();next()};document.head.append(s)};next()})}
function libs(){
 if(L.libsP)return L.libsP;
 L.libsP=(async()=>{
  await Promise.all([loadScript(['lib-pdf.min.js',CDN+'pdf.js/3.11.174/pdf.min.js']),loadScript(['lib-pdf-lib.min.js',CDN+'pdf-lib/1.17.1/pdf-lib.min.js'])]);
  let w=null;
  for(const u of ['lib-pdf.worker.min.js',CDN+'pdf.js/3.11.174/pdf.worker.min.js']){try{const r=await fetch(u);if(r.ok){w=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));break}}catch{}}

/* ── colour + geometry of a book ── */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),l=(m+n)/2;let h=0,s=0;if(m!==n){const d=m-n;s=l>.5?d/(2-m-n):d/(m+n);h=m===r?(g-b)/d+(g<b?6:0):m===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}
function pickColor(cv,title){
 const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(cv,0,0,8,8);const d=x.getImageData(0,0,8,8).data;
 let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/4;
 let {h,s,l}=rgb2hsl(r/n,g/n,b/n);
 if(s<.18)h=hash(title)%360;
 return{h:Math.round(h),s:Math.min(.62,Math.max(.38,s)),l:Math.min(.36,Math.max(.22,l*.55))};
}
const dims=(b,k=1)=>{
 const t=Math.round(Math.max(17,Math.min(58,10+b.pages*.55))*k),
  h=Math.round((136+(hash(b.id)%4)*11+(b.aspect<.62?14:0))*k),
  d=Math.round(Math.max(72,Math.min(128,h*b.aspect))*(k>1?1:1));

};
const spineFont=(title,t,h)=>{const avail=h-44,len=Math.max(1,[...title].length);return Math.round(Math.max(9,Math.min(t*.34+2,avail/(len*.56)))*10)/10};
const spineText=(title,t,h)=>{const avail=h-44,max=Math.floor(avail/(9*.56)),a=[...title];return a.length>max?a.slice(0,Math.max(3,max-1)).join('').trim()+'…':title};

 const {t,h,d}=dims(b,k),c=b.color||{h:30,s:.4,l:.3},hs=(l)=>`hsl(${c.h} ${Math.round(c.s*100)}% ${Math.round(l*100)}%)`;

 el.innerHTML=`<div class="bk" style="--t:${t}px;--h:${h}px;--d:${d}px;--c:${hs(c.l)};--cd:${hs(c.l*.62)};--cl:${hs(Math.min(.55,c.l*1.28))};--ink:#f4e6c6">

async function coverOf(doc){
 const p=await doc.getPage(1),v1=p.getViewport({scale:1}),sc=300/v1.width,vp=p.getViewport({scale:sc});
 const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
 const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
 await p.render({canvasContext:cx,viewport:vp}).promise;
 return{cv,aspect:v1.width/v1.height,thumb:cv.toDataURL('image/jpeg',.8)};
}
async function addOne(file){
 await libs();
 const buf=await file.arrayBuffer();
 if(new TextDecoder().decode(new Uint8Array(buf,0,Math.min(1024,buf.byteLength))).indexOf('%PDF-')<0)throw new Error(file.name+' is not a PDF');
 let doc;
 try{doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise}
 catch(e){throw new Error(e&&e.name==='PasswordException'?file.name+' is password-protected. Remove its password first, then add it.':file.name+' could not be opened')}
 const c=await coverOf(doc);
 let title='';try{const m=await doc.getMetadata();title=(m.info&&m.info.Title||'').trim()}catch{}
 if(title.length<2)title=file.name.replace(/\.pdf$/i,'');
 const id='bk'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const meta={id,title:title.slice(0,120),pages:doc.numPages,size:buf.byteLength,added:Date.now(),last:null,page:1,zoom:1,aspect:c.aspect,cover:c.thumb,color:pickColor(c.cv,title)};
 doc.destroy();
 await idbPut('data',id,await encB(buf));
 await saveMeta(meta);
 L.books.push(meta);
}
async function addFiles(files){

 msg('Encrypting and adding '+list.length+(list.length>1?' books…':' book…'),20000);
 let ok=0;

 if(ok)msg(ok+(ok>1?' books added':' book added'));

}

/* ── annotations ──
   objects: {t:'pen',c,w,p:[[x,y]..]}  {t:'hl',c,r:[x,y,w,h]}  {t:'tx',c,fs,x,y,s}
   positions are 0..1 of the displayed page; widths and font sizes are PDF points. */
const PEN_W=[1.5,3,6],TXT_S=[11,15,22];
function drawAnn(i,live){
 const c=L.cur;if(!c)return;const pg=q$(`#rs .pg[data-i="${i}"]`);if(!pg)return;
 const pc=q$('.pc',pg),ac=q$('.ac',pg);if(!pc.width)return;
 if(ac.width!==pc.width||ac.height!==pc.height){ac.width=pc.width;ac.height=pc.height}
 const cx=ac.getContext('2d'),W=ac.width,H=ac.height,s=W/c.sizes[i].w;
 cx.clearRect(0,0,W,H);
 const list=(c.ann[i]||[]).concat(live?[live]:[]);
 for(const o of list){
  if(o.t==='hl'){cx.globalAlpha=.38;cx.fillStyle=o.c;cx.fillRect(o.r[0]*W,o.r[1]*H,o.r[2]*W,o.r[3]*H);cx.globalAlpha=1}
  else if(o.t==='pen'){cx.strokeStyle=o.c;cx.lineWidth=o.w*s;cx.lineCap=cx.lineJoin='round';cx.beginPath();const p=o.p;cx.moveTo(p[0][0]*W,p[0][1]*H);
   if(p.length===1)cx.lineTo(p[0][0]*W+.01,p[0][1]*H);
   for(let k=1;k<p.length-1;k++){const mx=(p[k][0]+p[k+1][0])/2*W,my=(p[k][1]+p[k+1][1])/2*H;cx.quadraticCurveTo(p[k][0]*W,p[k][1]*H,mx,my)}
   if(p.length>1)cx.lineTo(p.at(-1)[0]*W,p.at(-1)[1]*H);cx.stroke()}
  else if(o.t==='tx'){cx.fillStyle=o.c;cx.textBaseline='top';cx.font=`${o.fs*s}px -apple-system,"Segoe UI",system-ui,sans-serif`;o.s.split('\n').forEach((ln,k)=>cx.fillText(ln,o.x*W,o.y*H+k*o.fs*s*1.2))}
 }
}
function bbox(i,o){
 const c=L.cur,pg=q$(`#rs .pg[data-i="${i}"]`),W=pg.clientWidth,H=pg.clientHeight,s=W/c.sizes[i].w;
 if(o.t==='hl')return[o.r[0]*W,o.r[1]*H,o.r[2]*W,o.r[3]*H];

  if(kind==='rot'){const p=pdf.getPage(i);p.setRotation(PDFLib.degrees((p.getRotation().angle+90)%360));(c.ann[i]||[]).forEach(rotPt)}

async function loadAll(){
  const d=await db();
  M.tracks=await new Promise((res,rej)=>{const out=[];const c=d.transaction('tracks').objectStore('tracks').openCursor();c.onsuccess=()=>{const k=c.result;if(k){const v=k.value;out.push({id:v.id,name:v.name,artist:v.artist,size:v.size,added:v.added,dur:v.dur||0});k.continue()}else res(out)};c.onerror=()=>rej(c.error)});
  M.tracks.sort((a,b)=>a.added-b.added);M.loaded=true}
const getBlob=async id=>{const d=await db();return new Promise((res,rej)=>{const r=d.transaction('tracks').objectStore('tracks').get(id);r.onsuccess=()=>res(r.result&&r.result.blob);r.onerror=()=>rej(r.error)})};
function parseName(f){
  let n=f.name.replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[_]+/g,' ').trim();let artist='';
  const m=n.match(/^(.{1,60}?)\s+[-–—]\s+(.+)$/);if(m){artist=m[1].trim();n=m[2].trim()}
  return{name:n||'Untitled',artist}}
function probe(blob){return new Promise(res=>{const a=new Audio(),u=URL.createObjectURL(blob);let done=false;
  const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);res(v)};
  a.preload='metadata';a.onloadedmetadata=()=>fin({ok:true,dur:isFinite(a.duration)?a.duration:0});a.onerror=()=>fin({ok:false,dur:0});setTimeout(()=>fin({ok:true,dur:0}),6000);a.src=u})}
async function addFiles(files){
  let added=0,bad=0;
  for(const f of files){
    if(!(f.type.startsWith('audio/')||/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|aif|aiff|caf)$/i.test(f.name))){bad++;continue}
    const p=await probe(f);if(!p.ok){bad++;continue}
    const {name,artist}=parseName(f);
    const rec={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,artist,size:f.size,added:Date.now()+added,dur:p.dur,type:f.type,blob:f};
    try{await tx('readwrite',s=>s.put(rec));M.tracks.push({id:rec.id,name,artist,size:f.size,added:rec.added,dur:p.dur});added++}
    catch(e){msg('Could not save "'+name+'" – is storage full?');break}}
  fill();bar();
  if(added)msg(added+(added===1?' song':' songs')+' added'+(bad?' · '+bad+' skipped':''));else if(bad)msg('That file type cannot be played on this device');
  try{if(navigator.storage&&navigator.storage.persist){M.persisted=await navigator.storage.persist();fill()}}catch{}}
async function removeTrack(id){
  const i=M.tracks.findIndex(t=>t.id===id);if(i<0)return;
  const wasCur=i===M.cur;
  try{await tx('readwrite',s=>s.delete(id))}catch{}
  M.tracks.splice(i,1);
  if(wasCur){au.pause();au.removeAttribute('src');au.load();if(M.url){URL.revokeObjectURL(M.url);M.url=null}M.cur=-1;ms()}
  else if(i<M.cur)M.cur--;
  M.confirm=null;fill();bar()}

/* ── playback ── */
function msg(t,ms=3000){document.querySelectorAll('.msg').forEach(n=>n.remove());const m=document.createElement('div');m.className='msg';m.setAttribute('role','status');m.textContent=t;document.body.append(m);setTimeout(()=>m.remove(),ms)}
async function playIndex(i,autoplay=true){
  const t=M.tracks[i];if(!t)return;
  M.cur=i;pref.last=t.id;savePref();
  let blob;try{blob=await getBlob(t.id)}catch{}
  if(!blob||M.tracks[M.cur]!==t){if(!blob)msg('This song could not be read');return}
  if(M.url)URL.revokeObjectURL(M.url);
  M.url=URL.createObjectURL(blob);au.src=M.url;
  fill();bar();ms();
  if(autoplay){try{await au.play()}catch(e){if(e&&e.name==='NotAllowedError')msg('Tap play to start');else msg('Cannot play "'+t.name+'" on this device')}}}
function toggle(){
  if(M.cur<0){if(M.tracks.length){const i=Math.max(0,M.tracks.findIndex(t=>t.id===pref.last));playIndex(i)}return}
  if(au.paused){au.play().catch(()=>msg('Tap play to start'))}else au.pause()}
function pick(dir){
  const n=M.tracks.length;if(!n)return;
  if(pref.shuffle&&n>1){let j;do{j=Math.floor(Math.random()*n)}while(j===M.cur);return j}
  return M.cur<0?0:(M.cur+dir+n)%n}
function next(auto){
  const n=M.tracks.length;if(!n)return;
  if(auto&&pref.repeat==='one'){au.currentTime=0;au.play().catch(()=>{});return}
  if(auto&&pref.repeat==='off'&&!pref.shuffle&&M.cur===n-1){au.pause();au.currentTime=0;upd();return}
  playIndex(pick(1))}
function prev(){if(au.currentTime>3){au.currentTime=0;return}playIndex(pick(-1))}
au.addEventListener('ended',()=>next(true));
au.addEventListener('play',()=>{upd();ms()});au.addEventListener('pause',upd);
au.addEventListener('timeupdate',()=>{upd();psPos()});
au.addEventListener('loadedmetadata',()=>{const t=M.tracks[M.cur];if(t&&isFinite(au.duration)&&Math.abs((t.dur||0)-au.duration)>1){t.dur=au.duration}upd();psPos()});
au.addEventListener('error',()=>{if(M.cur>=0)msg('Cannot play this file on this device')});

/* ── lock screen / headphones ── */
function ms(){
  if(!('mediaSession' in navigator))return;
  const t=M.tracks[M.cur];
  try{navigator.mediaSession.metadata=t?new MediaMetadata({title:t.name,artist:t.artist||'FlowVault',album:'FlowVault'}):null}catch{}
}
let psT=0;
function psPos(){if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState)return;const n=performance.now();if(n-psT<1000)return;psT=n;
  try{if(isFinite(au.duration)&&au.duration>0)navigator.mediaSession.setPositionState({duration:au.duration,position:Math.min(au.currentTime,au.duration),playbackRate:au.playbackRate||1})}catch{}}
if('mediaSession' in navigator){
  const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};
  set('play',()=>toggle());set('pause',()=>au.pause());set('previoustrack',prev);set('nexttrack',()=>next(false));
  set('seekto',d=>{if(d&&d.seekTime!=null)au.currentTime=d.seekTime});
  set('seekbackward',d=>{au.currentTime=Math.max(0,au.currentTime-((d&&d.seekOffset)||10))});
  set('seekforward',d=>{au.currentTime=Math.min(au.duration||1e9,au.currentTime+((d&&d.seekOffset)||10))})}

/* ── UI ── */
const art=t=>{const h=hash(t.id),a=h%360;return `background:linear-gradient(135deg,hsl(${a} 55% 42%),hsl(${(a+50)%360} 60% 28%))`};

   <div class="mctl"><button class="ghost${pref.shuffle?' on':''}" data-m="shuffle" aria-label="Shuffle" aria-pressed="${pref.shuffle}">🔀</button><button class="ghost" data-m="prev" aria-label="Previous">⏮</button><button class="btn mplay" data-m="toggle" id="mplay" aria-label="Play or pause">▶</button><button class="ghost" data-m="next" aria-label="Next">⏭</button><button class="ghost${pref.repeat!=='off'?' on':''}" data-m="repeat" aria-label="Repeat: ${pref.repeat}">${pref.repeat==='one'?'🔂':'🔁'}</button></div>

function fill(){

  else l.innerHTML=M.tracks.map((t,i)=>`<div class="mrow${i===M.cur?' cur':''}"><button class="mpick" data-m="play" data-i="${i}"><i style="${art(t)}">${i===M.cur&&!au.paused?'▮▮':'♪'}</i><span><b class="priv">${esc(t.name)}</b><small class="mute">${esc(t.artist||'Unknown artist')} · ${fmt(t.dur)}</small></span></button>
   ${M.confirm===t.id?`<button class="ghost d" data-m="del" data-id="${t.id}">Delete?</button><button class="ghost" data-m="keep">No</button>`:`<button class="ghost" data-m="ask" data-id="${t.id}" aria-label="Remove ${esc(t.name)}">✕</button>`}</div>`).join('')
   +(M.persisted===false?'<p class="mute" style="padding:8px 16px;font-size:12px">iOS may clear stored songs if the phone runs low on space.</p>':'');

function upd(){
  const p=q$('#mplay'),bp=q$('#bplay');const playing=!au.paused&&M.cur>=0;
  if(p)p.textContent=playing?'⏸':'▶';if(bp)bp.textContent=playing?'⏸':'▶';
  const d=isFinite(au.duration)?au.duration:(M.tracks[M.cur]?M.tracks[M.cur].dur:0)||0;
  const s=q$('#mseek');if(s&&!M.seeking){s.value=d?Math.round(au.currentTime/d*1000):0}
  const c=q$('#mcur'),du=q$('#mdur');if(c)c.textContent=fmt(au.currentTime);if(du)du.textContent=fmt(d);
  const mp=q$('#bprog');if(mp)mp.style.width=(d?au.currentTime/d*100:0)+'%';
  document.querySelectorAll('.mrow.cur .mpick i').forEach(i=>i.textContent=playing?'▮▮':'♪')}
/* mini player: stays visible when the pane is closed */

  upd()}
async function openMusic(){
  M.open=true;pane();bar();fill();
  if(!M.loaded){try{await loadAll()}catch{msg('Music storage is not available here')}M.loaded=true;
    if(M.cur<0&&pref.last){/* remember last song without autoplay */}
    fill()}}
function closeMusic(){M.open=false;q$('#mu')?.remove();M.confirm=null;bar()}
window.musicOpen=openMusic;
window.musicReset=()=>{M.open=false;q$('#mu')?.remove();M.confirm=null;bar()};  /* vault lock: close the pane, keep playing */
window.musicBottom=()=>{const w=q$('#mu');if(w)w.style.bottom=document.getElementById('hud')?'84px':'0';bar()};

document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-m]');if(!b)return;
  const a=b.dataset.m;
  if(a==='open')openMusic();else if(a==='close')closeMusic();
  else if(a==='toggle')toggle();else if(a==='prev')prev();else if(a==='next')next(false);
  else if(a==='play')playIndex(+b.dataset.i);
  else if(a==='shuffle'){pref.shuffle=!pref.shuffle;savePref();now()}
  else if(a==='repeat'){pref.repeat={off:'all',all:'one',one:'off'}[pref.repeat];savePref();now()}
  else if(a==='ask'){M.confirm=b.dataset.id;fill()}else if(a==='keep'){M.confirm=null;fill()}
  else if(a==='del')removeTrack(b.dataset.id)});

  if(e.target.id==='mfile'){const fs=[...e.target.files];e.target.value='';addFiles(fs)}
  else if(e.target.id==='mfocus'){pref.focus=e.target.checked;savePref()}});

document.addEventListener('change',e=>{if(e.target.id==='mseek'){const d=au.duration;if(isFinite(d))au.currentTime=e.target.value/1000*d;M.seeking=false}},true);

/* start music together with a focus block */
async function focusStart(){
  if(!pref.focus||!au.paused)return;
  if(!M.loaded){try{await loadAll()}catch{return}}
  if(!M.tracks.length)return;
  if(M.cur>=0)au.play().catch(()=>{});else{const i=Math.max(0,M.tracks.findIndex(t=>t.id===pref.last));playIndex(pref.shuffle?pick(1):i)}}
if(typeof window.startBlock==='function'){const o=window.startBlock;window.startBlock=function(){const r=o.apply(this,arguments);try{focusStart()}catch{}return r}}
/* restore the mini player after a reload */
(async()=>{try{await loadAll();const i=M.tracks.findIndex(t=>t.id===pref.last);if(i>=0){M.cur=i;const blob=await getBlob(pref.last);if(blob){M.url=URL.createObjectURL(blob);au.src=M.url;ms();bar()}}}catch{}})();
})();

/* ───────── FlowVault Memories: encrypted copybook diary with pages, sticky notes and PDF export ───────── */
(()=>{
'use strict';
const q$=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
/* page geometry, in units where the page is 100 wide and 140 tall */
const PW=100,PH=140,TOP=17,LH=7.4,NL=15,TX=15,TW=78,NW=38,NH=31,NLH=5.4;
const FONTS={
 caveat:{n:'Caveat',fam:`'FV Caveat','FV Aref',cursive`,fs:6.5},
 patrick:{n:'Neat print',fam:`'FV Patrick','FV Aref',cursive`,fs:5.5},
 indie:{n:'Round hand',fam:`'FV Indie','FV Aref',cursive`,fs:5.2},
 gloria:{n:'Marker',fam:`'FV Gloria','FV Aref',cursive`,fs:4.6},
 kalam:{n:'Kalam',fam:`'FV Kalam','FV Aref',cursive`,fs:5.1},
 dancing:{n:'Cursive',fam:`'FV Dancing','FV Aref',cursive`,fs:5.9},
 elite:{n:'Typewriter',fam:`'FV Elite','FV Aref',monospace`,fs:4.6},
 ruqaa:{n:'رقعة',fam:`'FV Aref','FV Caveat',cursive`,fs:5.1},
 amiri:{n:'نسخ',fam:`'FV Amiri','FV Aref',serif`,fs:5.3}};
const INKS={blue:'#1f3a8a',black:'#16181d',red:'#a61e2f',green:'#14532d',purple:'#5b21b6',sepia:'#7a4a1f'};
const PAPERS={lined:'Lined',grid:'Grid',dots:'Dots',copy:'Copybook',blank:'Blank'};
const BG={lined:'#fbf6e8',grid:'#fcfcf7',dots:'#fbf7ee',copy:'#fffcf0',blank:'#fffdf5'};
const SIZES={s:.86,m:1,l:1.15};
const NCOL=['#ffe27a','#ffb3c7','#a8e1ff','#b9f0b0','#e2c6ff'];
const ISAR=/[֐-ࣿיִ-﷿ﹰ-﻿]/,STRONG=/[A-Za-zÀ-ɏ֐-ࣿיִ-﷿ﹰ-﻿]/;
const M={nbs:[],loaded:false,open:false,cur:null,pi:0,styleOpen:false,sel:null,editNote:null,confirm:null,newForm:false,dirty:false,menu:false,busy:false};
let saveT=0,composing=false,dbP=null;
window.__mem={M};
const dstr=()=>new Date().toLocaleDateString([], {weekday:'short',day:'numeric',month:'short',year:'numeric'});
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ── metrics and paper art ── */
const MC={};
function metrics(fid){
  if(MC[fid])return MC[fid];
  let a=.8,d=.25;
  try{const c=document.createElement('canvas').getContext('2d');c.font='200px '+FONTS[fid].fam;const m=c.measureText('Hxgj');
    if(m.fontBoundingBoxAscent){a=m.fontBoundingBoxAscent/200;d=m.fontBoundingBoxDescent/200}}catch{}
  return MC[fid]={a,d}}
function layout(p){const fs=FONTS[p.font].fs*SIZES[p.size],m=metrics(p.font);return{fs,bl:(LH-(m.a+m.d)*fs)/2+m.a*fs}}
const PC={};
function paperSVG(p){
  const L=layout(p),key=p.paper+p.font+p.size;if(PC[key])return PC[key];
  const rule=i=>+(TOP+i*LH+L.bl+.16*L.fs).toFixed(2);let s='';
  const line=(y,c,w,dash)=>`<line x1="0" x2="100" y1="${y}" y2="${y}" stroke="${c}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
  if(p.paper==='lined'){for(let i=0;i<NL;i++)s+=line(rule(i),'#aebfe0',.28);s+=`<line x1="11" x2="11" y1="0" y2="140" stroke="#e9a1a1" stroke-width=".4"/>`}
  else if(p.paper==='grid'){const y0=rule(0)-LH;for(let y=y0;y<PH;y+=LH)s+=line(+y.toFixed(2),'#b9d6c4',.22);for(let x=TX-3.5;x<PW;x+=LH)s+=`<line y1="0" y2="140" x1="${x.toFixed(2)}" x2="${x.toFixed(2)}" stroke="#b9d6c4" stroke-width=".22"/>`;for(let x=TX-3.5-LH;x>0;x-=LH)s+=`<line y1="0" y2="140" x1="${x.toFixed(2)}" x2="${x.toFixed(2)}" stroke="#b9d6c4" stroke-width=".22"/>`}
  else if(p.paper==='dots'){for(let y=rule(0);y<PH-4;y+=LH)for(let x=TX-3.5-LH*2;x<PW-2;x+=LH)if(x>2)s+=`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r=".5" fill="#a9b0c0"/>`}
  else if(p.paper==='copy'){for(let i=0;i<NL;i++){const b=rule(i)-.16*L.fs;s+=line(+b.toFixed(2),'#6f8fd6',.3)+line(+(b-L.fs*.5).toFixed(2),'#b9c8ea',.22,'1.2 1')+line(+(b-LH*.8).toFixed(2),'#d5def3',.2)}s+=`<line x1="11" x2="11" y1="0" y2="140" stroke="#e9a1a1" stroke-width=".4"/>`}
  let holes='';for(const y of [22,70,118])holes+=`<circle cx="4.6" cy="${y}" r="1.9" fill="#d8d0bb" stroke="#c4bba3" stroke-width=".3"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" preserveAspectRatio="none"><rect width="100" height="140" fill="${BG[p.paper]}"/>${s}${holes}</svg>`;
  return PC[key]=svg}
const paperURI=p=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(paperSVG(p));

/* ── storage: every notebook is one encrypted record ── */
const db=()=>dbP||(dbP=new Promise((res,rej)=>{const r=indexedDB.open('flowvault-memories',1);r.onupgradeneeded=()=>r.result.createObjectStore('nb',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>{dbP=null;rej(r.error)}}));
const idb=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('nb',mode);let out;try{out=fn(t.objectStore('nb'))}catch(e){rej(e);return}t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
async function encRec(nb,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(nb)));return{id:nb.id,at:nb.updated,iv,ct}}
async function decRec(r,k){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.iv},k,r.ct)))}
async function loadAll(){
  const k=key,all=await idb('readonly',s=>s.getAll());M.nbs=[];
  for(const r of all||[]){try{M.nbs.push(await decRec(r,k))}catch{}}
  M.nbs.sort((a,b)=>b.updated-a.updated);M.loaded=true}
function markDirty(){M.dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){
  clearTimeout(saveT);if(!M.dirty||!M.cur||typeof key==='undefined'||!key)return;
  M.dirty=false;const nb=M.cur;nb.updated=Date.now();
  try{const rec=await encRec(nb,key);await idb('readwrite',s=>s.put(rec))}catch{M.dirty=true}}
const flushNow=()=>{if(M.dirty)flush()};

/* ── notebook model ── */
function newPage(from){const b=from||{font:'caveat',ink:'blue',paper:'lined',size:'m'};return{id:uid('p'),text:'',font:b.font,ink:b.ink,paper:b.paper,size:b.size,date:dstr(),notes:[]}}
function createNb(title){
  const d={font:'caveat',ink:'blue',paper:'lined',size:'m'};
  const nb={id:uid('b'),title:title||'My memories',created:Date.now(),updated:Date.now(),hue:hash(title+Date.now())%360,defaults:d,pages:[newPage(d)]};

const pg=()=>M.cur.pages[M.pi];

/* ── fitting text on a page (offscreen measuring box) ── */
let box=null;
function measureBox(){
  const st=q$('#mstage .mpage');const w=st?st.clientWidth:Math.min(420,innerWidth-24);
  if(!box){box=document.createElement('div');box.className='mpage mmeasure';box.innerHTML='<textarea class="mta" tabindex="-1" aria-hidden="true"></textarea>';document.body.append(box)}
  box.style.width=w+'px';return box}
function styleTa(ta,p){const L=layout(p);ta.style.fontFamily=FONTS[p.font].fam;ta.style.fontSize=L.fs+'cqw';ta.style.top=TOP+'cqw';ta.style.left=TX+'cqw';ta.style.width=TW+'cqw';ta.style.height=(NL*LH)+'cqw';ta.style.lineHeight=LH+'cqw';ta.style.color=INKS[p.ink]}
function fits(ta,text){ta.value=text;return ta.scrollHeight<=ta.clientHeight+1}
function cutPoint(p,text){
  const b=measureBox(),ta=b.firstChild;styleTa(ta,p);
  if(fits(ta,text))return text.length;
  let lo=0,hi=text.length;while(lo<hi){const mid=(lo+hi+1)>>1;if(fits(ta,text.slice(0,mid)))lo=mid;else hi=mid-1}
  if(lo>0&&lo<text.length&&!/\s/.test(text[lo])&&!/\s/.test(text[lo-1])){const sp=Math.max(text.lastIndexOf(' ',lo-1),text.lastIndexOf('\n',lo-1));if(sp>lo*.5)lo=sp+1}
  return lo}
/* flow text forward from page i; returns {page,offset} where an original caret that moved off page i lands */
function reflow(i,caret){
  let land=null,idx=i;
  while(idx<M.cur.pages.length){
    const p=M.cur.pages[idx],cut=cutPoint(p,p.text);
    if(cut>=p.text.length)break;
    const rest=p.text.slice(cut);p.text=p.text.slice(0,cut);
    if(land===null&&idx===i&&caret!=null&&caret>cut)land={page:idx+1,offset:caret-cut};
    else if(land&&land.page===idx&&land.offset>cut)land={page:idx+1,offset:land.offset-cut};
    let nx=M.cur.pages[idx+1];
    if(!nx){nx=newPage(p);M.cur.pages.push(nx)}
    nx.text=rest+nx.text;idx++}
  return land}

/* ── fonts ── */
async function fontsReady(nb){

  try{await Promise.all([...used].flatMap(f=>[document.fonts.load('40px '+FONTS[f].fam,'Abc'),document.fonts.load('40px '+FONTS[f].fam,'ذكريات')]));await document.fonts.ready}catch{}
  for(const f of used)delete MC[f];for(const k of Object.keys(PC))delete PC[k]}

/* ── PDF export: each page is drawn on a canvas exactly like the screen, then placed in an A5-proportioned PDF ── */
function mirrorLines(text,fam,fsU,lhU,widthU,wpx){
  const u=wpx/PW,d=document.createElement('div');
  d.style.cssText=`position:absolute;left:-99999px;top:0;width:${widthU*u}px;font-family:${fam};font-size:${fsU*u}px;line-height:${lhU*u}px;white-space:pre-wrap;overflow-wrap:break-word;unicode-bidi:plaintext;text-align:start`;
  d.textContent=text;document.body.append(d);
  const out=[];let cur='',top=null,para=0;const t=d.firstChild,r=document.createRange(),lhPx=lhU*u;
  const push=()=>{out.push({s:cur,para});cur='';top=null};
  if(t){for(let i=0;i<text.length;i++){const ch=text[i];
    if(ch==='\n'){push();para++;continue}
    r.setStart(t,i);r.setEnd(t,i+1);const rc=r.getClientRects();const y=rc.length?rc[0].top:null;
    if(top!==null&&y!==null&&y>top+lhPx*.5){push()}
    if(y!==null&&top===null)top=y;
    cur+=ch}}
  push();d.remove();
  return out}
const paraDir=(s)=>{const m=s.match(STRONG);return m&&ISAR.test(m[0])?'rtl':'ltr'};
function drawLines(ctx,lines,fam,fsU,lhU,x0,x1,y0,u,color,bl){
  ctx.font=`${fsU*u}px ${fam}`;ctx.fillStyle=color;ctx.textBaseline='alphabetic';
  const dirs={};const paras={};
  for(const l of lines){(paras[l.para]=paras[l.para]||[]).push(l.s)}
  for(const k in paras)dirs[k]=paraDir(paras[k].join(''));
  lines.forEach((l,i)=>{
    const rtl=dirs[l.para]==='rtl';ctx.direction=rtl?'rtl':'ltr';ctx.textAlign=rtl?'right':'left';
    ctx.fillText(l.s.replace(/\s+$/,''),(rtl?x1:x0)*u,(y0+i*lhU+bl)*u)});
  ctx.direction='ltr';ctx.textAlign='left'}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('paper'));i.src=src})}
async function renderPage(nb,p,W){

  /* date and page number */
  const idx=nb.pages.indexOf(p);
  const mt=metrics(p.font),by=(top,lh,f)=>top+(lh-(mt.a+mt.d)*f)/2+mt.a*f;
  ctx.fillStyle=ink;ctx.font=`${4.2*u}px ${fam}`;ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.globalAlpha=.8;ctx.fillText(p.date||'',(PW-6)*u,by(4,6,4.2)*u);
  ctx.textAlign='center';ctx.font=`${4*u}px ${fam}`;ctx.fillText(String(idx+1),PW/2*u,by(128.5,6,4)*u);ctx.globalAlpha=1;ctx.textAlign='left';
  /* body text */
  drawLines(ctx,mirrorLines(p.text,fam,L.fs,LH,TW,wpx).slice(0,NL),fam,L.fs,LH,TX,TX+TW,TOP,u,ink,L.bl);
  /* sticky notes with pins */
  for(const nt of p.notes){
    ctx.save();const cx=(nt.x+NW/2)*u,cy=(nt.y+NH/2)*u;ctx.translate(cx,cy);ctx.rotate(nt.r*Math.PI/180);

/* ── conversation ── */
const SAD=/\b(sad|tired|stress|stressed|lonely|bad day|sorry|cry|depress)\w*|حزين|تعبان|زهقان|زعلان/i,NICE=/\b(thanks|thank you|love you|awesome|great|amazing|good job|well done)\b|شكرا|شكراً|حبيبي|يعطيك العافية|ممتاز|برافو/i;

function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[-•*] (.+)$/gm,'<span class="aib">• $1</span>').replace(/\n/g,'<br>')}

function probe(blob){return new Promise(res=>{

  const fin=r=>{if(done)return;done=true;clearTimeout(tm);v.removeAttribute('src');v.load();URL.revokeObjectURL(u);res(r)};

  v.muted=true;v.preload='auto';v.playsInline=true;v.setAttribute('playsinline','');
  let info=null;

  v.onloadedmetadata=()=>{info={ok:true,dur:isFinite(v.duration)?v.duration:0,w:v.videoWidth,h:v.videoHeight};
    if(!info.w||!info.h){fin({ok:false,dur:info.dur,w:0,h:0,thumb:''});return}

async function getFF(){

   <button class="ghost" data-tv="cancelconv">Cancel</button></div>`}
async function convertFile(file){
  const hasMP4=!!document.createElement('video').canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"');
  const ext=hasMP4?'mp4':'webm',mime=hasMP4?'video/mp4':'video/webm';

  f.on('progress',onP);

    const inp=dir+'/input';
    const attempts=[
      ['Preparing',['-i',inp,'-map','0:v:0','-map','0:a:0?','-sn','-dn','-c','copy',...(hasMP4?['-movflags','+faststart']:[]),out]],
      ['Converting',hasMP4

        :['-i',inp,'-map','0:v:0','-map','0:a:0?','-sn','-dn','-c:v','libvpx','-deadline','realtime','-cpu-used','8','-b:v','1500k','-vf',"scale='min(1280,iw)':-2",'-c:a','libvorbis',out]]];

  else{try{await f.unmount(dir)}catch{};try{await f.deleteDir(dir)}catch{}}

    const v=+m[1];if(v<=BUILD||document.getElementById('updbar'))return;
    const b=document.createElement('div');b.id='updbar';b.setAttribute('role','status');
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:50;background:var(--panel,#171c24);color:var(--text,#e2e8f0);border:1px solid var(--sig,#5fd1c4);border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw;font-size:14px';
    b.innerHTML='<span>New version v'+v+' is ready</span><button class="btn" style="padding:6px 12px">Update</button>';
    b.querySelector('button').onclick=()=>{location.replace(location.pathname+'?u='+Date.now())};
    document.body.append(b);
  }catch{}
}
setTimeout(check,2500);setInterval(check,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
window.__upd={BUILD,check};
})();

</script>
