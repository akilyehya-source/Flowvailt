<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowVault</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlowVault">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10141a">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0d1117;--ink:#10141a;--panel:#171c24;--card:#131820;--line:#262d38;--text:#e2e8f0;--mute:#94a3b8;--brass:#d4a85a;--sig:#5fd1c4;--onbrass:#10141a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f7;--ink:#fff;--panel:#fff;--card:#fafbfc;--line:#dde1e7;--text:#1b2230;--mute:#5b6678;--brass:#9a6b12;--sig:#0b7f74;--onbrass:#fff}}
:root[data-theme="dark"]{--bg:#0d1117}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);border-bottom:1px solid var(--line)}
.logo{font-weight:600;color:var(--brass)}
.search{flex:1;max-width:440px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--mute);text-align:left}
.search kbd{margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12px}
.state{font-size:12px;color:var(--sig);white-space:nowrap}
.btn{background:var(--brass);color:var(--onbrass);border:0;border-radius:9px;padding:7px 12px;font-weight:600;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--text);transition:background .15s}
.ghost:hover{background:var(--panel)}
main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
section,aside{overflow-y:auto;padding:20px}
aside{background:var(--ink);border-left:1px solid var(--line)}
h2{margin:0 0 14px;font-size:17px}aside h2{font-size:14px;margin:0}
ol{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px solid var(--line)}
li.b{position:relative;margin-bottom:14px}
li.b:before{content:"";position:absolute;left:-28px;top:16px;width:11px;height:11px;border-radius:50%;background:#3a4454}
li.b.active:before{background:var(--sig);box-shadow:0 0 0 4px color-mix(in srgb,var(--sig) 25%,transparent)}
li.b.completed:before{background:var(--brass)}
.blk{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;transition:border-color .15s}
.blk:hover{border-color:#3a4454}.blk.sel{border-color:var(--sig);background:var(--panel)}
.completed .blk{opacity:.6}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mute{color:var(--mute);font-size:12px}
.big{font-size:26px;font-weight:600;color:var(--sig);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px}
.link{background:none;border:0;padding:4px 0;font-size:12px;color:var(--sig)}.link.d{color:var(--brass)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateX(10px)}}
.card .acts{display:flex;gap:8px;margin-top:10px}.card .btn{flex:1}
.priv{transition:filter .2s}.blur .priv{filter:blur(6px);user-select:none}
.empty{color:var(--mute);margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:15vh;z-index:9}
.pal{width:min(520px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pal input{width:100%;background:none;border:0;padding:14px 16px;color:var(--text);font:inherit}
.pal button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:9px 16px;text-align:left}
.pal button.on{background:var(--panel)}
.toast{z-index:6;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .2s}
.lock{display:grid;place-items:center;height:100%;padding:20px}
.lock form{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.lock input{width:100%;margin:14px 0 10px;padding:10px 12px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit}
.err{color:#f08a8a;min-height:20px;font-size:13px}
.hud{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(640px,calc(100% - 24px));background:var(--panel);border:1px solid var(--sig);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:10px 14px;animation:in .2s;z-index:5}
.hud .r{display:flex;align-items:center;gap:12px}.hud .t{flex:1;min-width:0}.hud .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-size:26px;font-weight:700;letter-spacing:.12em;color:var(--sig);background:none;border:0;padding:0}.wheel{width:36px;height:36px;flex:none}
.web{position:fixed;inset:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:in .2s}
.tabs{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--ink);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--card);white-space:nowrap}.tab.on{border-color:var(--sig)}.tab button{background:none;border:0;padding:5px 9px}
.bar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.bar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--text);font:inherit}
.wbody{flex:1;min-height:0;overflow-y:auto}.wbody iframe{width:100%;height:100%;border:0;background:#fff}
.wcard{max-width:460px;margin:8vh auto;padding:20px;text-align:center}.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px}
.wfoot{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
@media(max-width:760px){main{grid-template-columns:1fr;overflow-y:auto}aside{border-left:0;border-top:1px solid var(--line)}.search span{display:none}}
input{font-size:16px!important} /* iOS zooms the page when an input is smaller than 16px */
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
/* ── crypto: same scheme as crypto.ts (PBKDF2-SHA256 600k → AES-GCM 256) ── */
async function deriveKey(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw.normalize('NFKC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(t,k){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(t));return{ciphertext:b64(new Uint8Array(c)),iv:b64(iv)}}
async function decryptData(c,iv,k){return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(c)))}
/* ── demo data ── */
const SEED=[
{id:'gh',t:'GitHub',c:'app',u:'dev@flowvault.demo',p:'demo-gh-Pass#1',url:'https://github.com',tags:['code'],totp:'JBSWY3DPEHPK3PXP'},
{id:'mail',t:'Work email',c:'email',u:'me@flowvault.demo',p:'demo-mail-Pass#2',url:'https://mail.google.com',tags:['inbox'],totp:'MFRGGZDFMZTWQ2LKNNWG23TP'},
{id:'stripe',t:'Stripe API key',c:'api_key',u:'sk_test_demo',p:'sk_test_DEMO_not_real',url:'https://dashboard.stripe.com',tags:['billing'],totp:'GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ'},
{id:'prod',t:'Prod server',c:'server',u:'deploy@10.0.0.7',p:'demo-ssh-Pass#4',url:null,tags:['ops']}];
const day=h=>{const d=new Date();d.setHours(h,0,0,0);return d.toISOString()};
let blocks=[
{id:'b1',title:'Ship billing fix',min:45,at:day(9),startedAt:null,status:'pending',ids:['gh','stripe'],primary:'gh'},
{id:'b2',title:'Inbox to zero',min:45,at:day(10),startedAt:null,status:'pending',ids:['mail'],primary:'mail'},
{id:'b3',title:'Patch production',min:45,at:day(11),startedAt:null,status:'pending',ids:['prod','gh'],primary:'prod'}];
const KEY='flowvault-demo';let vault=null;
try{vault=JSON.parse(localStorage.getItem(KEY))}catch{}
const saveVault=()=>{try{localStorage.setItem(KEY,JSON.stringify(vault))}catch{}};
/* ── state ── */
const LOCK_SEC=120;
let web=null,tabN=0,inApp=true,session=null,key=null,users={},privacy=false,sel=null,last=Date.now(),clip=null,palette=null;
const root=$('#root');
/* ── lock screen ── */
function showLock(msg=''){
 key=null;users={};palette=null;clipWipe();session=null;drawHud();web=null;drawWeb();
 const first=!vault;
 root.innerHTML=`<div class="lock"><form id="f"><div class="logo" style="font-size:18px">FlowVault</div>
 <p class="mute" style="margin:6px 0 0">${first?'Create a master password for this demo vault. Everything is encrypted in your browser before it is stored.':'Enter your master password to unlock.'}</p>
 <input id="pw" type="password" autocomplete="off" placeholder="Master password" aria-label="Master password" autofocus>
 <div class="err" id="err">${esc(msg)}</div>
 <button class="btn" style="width:100%" id="go">${first?'Create vault':'Unlock'}</button>
 ${first?'':'<p class="mute" style="text-align:center;margin:14px 0 0"><button type="button" class="link" id="reset">Forgot it? Reset demo vault</button></p>'}</form></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;if(pw.length<4){$('#err').textContent='Use at least 4 characters.';return}
  $('#go').disabled=true;$('#go').textContent='Deriving key…';
  try{await unlock(pw)}catch{showLock('Wrong master password.')}};
 const r=$('#reset');if(r)r.onclick=()=>{vault=null;try{localStorage.removeItem(KEY)}catch{}showLock()};
}
async function unlock(pw){
 let k;
 if(!vault){
  const salt=crypto.getRandomValues(new Uint8Array(16));k=await deriveKey(pw,salt);
  const verifier=await encryptData('flowvault:verifier:v1',k),items=[];
  for(const s of SEED){const e=await encryptData(JSON.stringify({username:s.u,password:s.p}),k);const tt=s.totp?await encryptData(s.totp,k):null;items.push({id:s.id,title:s.t,category:s.c,ct:e.ciphertext,iv:e.iv,url:s.url,tags:s.tags,tct:tt&&tt.ciphertext,tiv:tt&&tt.iv})}
  vault={salt:b64(salt),verifier,items};saveVault();
 }else{
  k=await deriveKey(pw,unb64(vault.salt));
  if(await decryptData(vault.verifier.ciphertext,vault.verifier.iv,k)!=='flowvault:verifier:v1')throw 0;
 }
 for(const i of vault.items)users[i.id]=JSON.parse(await decryptData(i.ct,i.iv,k)).username;
 let ch=0;for(const s of SEED){const i=vault.items.find(x=>x.id===s.id);if(s.totp&&i&&!i.tct){const e=await encryptData(s.totp,k);i.tct=e.ciphertext;i.tiv=e.iv;ch=1}}if(ch)saveVault();
 key=k;last=Date.now();render();
}
function lock(){showLock()}
/* ── dashboard ── */
const focusBlock=()=>blocks.find(b=>b.id===sel)||blocks.find(b=>b.status==='active')||blocks.find(b=>b.status==='pending')||null;
const remaining=b=>Math.max(0,Math.ceil((new Date(b.startedAt).getTime()+b.min*60000-Date.now())/1000));
const item=id=>vault.items.find(i=>i.id===id);
function render(){
 const fb=focusBlock();
 root.innerHTML=`<div class="app ${privacy?'blur':''}" id="app">
 <header><span class="logo">FlowVault</span>
 <button class="search" data-a="pal"><span>Search credentials and actions</span><kbd>⌘K</kbd></button>
 <span class="state tn" id="lk">Unlocked · locks in ${fmt(LOCK_SEC)}</span>
 <button class="ghost" data-a="web">Browser</button><button class="btn" data-a="lock">Lock now</button></header>
 <main><section aria-label="Today's focus blocks"><h2>Today</h2><ol>
 ${blocks.map(b=>`<li class="b ${b.status}"><button class="blk ${fb&&fb.id===b.id?'sel':''}" data-a="sel" data-id="${b.id}">
  <div class="row"><b>${esc(b.title)}</b><span class="mute tn">${new Date(b.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${b.min} min</span></div>
  ${b.status==='active'?`<div class="big tn" data-t="${b.id}">${fmt(remaining(b))}</div>`:''}
  ${b.spent!=null?`<div class="mute tn">Logged ${fmt(b.spent)}</div>`:''}<div class="chips">${b.ids.map(id=>`<span class="chip priv">${esc(item(id).title)}</span>`).join('')}</div></button>
  ${b.status==='pending'?`<button class="link" data-a="start" data-id="${b.id}">Start focus</button>`:''}
  ${b.status==='active'?`<button class="btn" style="padding:3px 10px;font-size:12px" data-a="ws" data-id="${b.id}">Launch workspace</button> <button class="link d" data-a="done" data-id="${b.id}">Mark done</button>`:''}</li>`).join('')}
 </ol></section>
 <aside aria-label="Linked credentials"><div class="row" style="align-items:center"><h2>${fb?'For: '+esc(fb.title):'Credentials'}</h2>
 <span style="display:flex;gap:6px"><button class="ghost" data-a="mode">${inApp?'Links: in app':'Links: new tabs'}</button><button class="ghost" data-a="priv" aria-pressed="${privacy}">${privacy?'Blur on':'Blur off'}</button></span></div>
 ${fb?fb.ids.map(id=>{const i=item(id);return`<div class="card"><div class="row"><b class="priv">${esc(i.title)}</b><span class="chip">${i.category}</span></div>
  <div class="mute priv" style="margin-top:2px">${esc(users[id]||'')}</div>
  <div class="acts"><button class="btn" data-a="copy" data-id="${id}">Copy password</button>
  <button class="ghost" data-a="open" data-id="${id}" ${i.url?'':'disabled'}>Launch URL</button></div></div>`}).join(''):'<p class="empty">No block selected.</p>'}
 </aside></main><div id="toast"></div></div>`;
}
/* ── actions ── */
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-a]');if(!el||!key)return;const a=el.dataset.a,id=el.dataset.id;
 if(a==='lock')lock();
 else if(a==='pal')openPalette();
 else if(a==='priv')togglePrivacy();
 else if(a==='sel'){sel=id;render()}
 else if(a==='start')startBlock(id);
 else if(a==='done'){if(session&&session.id===id)finish();else{blocks.find(b=>b.id===id).status='completed';render()}}
 else if(a==='ws')launchWorkspace(id)
 else if(a==='hcol'){session.open=!session.open;drawHud()}
 else if(a==='finish')finish()
 else if(a==='ccopy'){if(session.code!=='------')copySecret(session.code,'2FA code')}
 else if(a==='web'){web?(web.show=true,drawWeb()):openWeb('')}
 else if(a==='mode'){inApp=!inApp;render()}
 else if(a==='wtab'){web.active=id;drawWeb()}
 else if(a==='wx'){web.tabs=web.tabs.filter(t=>t.id!==id);if(!web.tabs.length)web=null;else if(web.active===id)web.active=web.tabs[web.tabs.length-1].id;drawWeb()}
 else if(a==='wnew')openWeb('')
 else if(a==='wclose'){web.show=false;drawWeb()}
 else if(a==='wgo'){if(standalone)window.open(item(id).url,'_blank','noopener,noreferrer');else{webCur().url=item(id).url;drawWeb()}}
 else if(a==='wext'){const u=webCur().url;if(u)window.open(u,'_blank','noopener,noreferrer')}
 else if(a==='open')launch(id);
 else if(a==='copy'){const i=item(id);const p=JSON.parse(await decryptData(i.ct,i.iv,key)).password;await copySecret(p,i.title)}
});
const togglePrivacy=()=>{privacy=!privacy;render()};
function startBlock(id){blocks.forEach(b=>{if(b.status==='active')b.status='pending'});const b=blocks.find(x=>x.id===id);b.status='active';b.startedAt=new Date().toISOString();sel=id;render()}
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function launch(id,focus=true){const i=item(id);if(!i||!i.url)return;if(inApp&&!standalone)return openWeb(i.url,focus);if(!focus&&standalone)return;try{const u=new URL(i.url);if(/^https?:$/.test(u.protocol))window.open(u.href,'_blank','noopener,noreferrer')}catch{}}
/* ── clipboard with 30 s wipe ── */
async function copySecret(v,label){
 try{await navigator.clipboard.writeText(v)}catch{}
 clip={v,label,end:Date.now()+30000};
}
async function clipWipe(){
 const c=clip;clip=null;if(!c)return;
 try{if(await navigator.clipboard.readText()!==c.v)return}catch{}
 try{await navigator.clipboard.writeText('')}catch{}
}
/* ── command palette ── */
function openPalette(){palette={q:'',i:0};drawPalette()}
function cmds(){const f=focusBlock();return[
 {l:privacy?'Turn privacy blur off':'Turn privacy blur on',run:togglePrivacy},
 {l:'Open in-app browser',run:()=>{web?(web.show=true,drawWeb()):openWeb('')}},
 {l:'Lock vault',run:lock},
 ...(f&&f.status==='pending'?[{l:'Start focus: '+f.title,run:()=>startBlock(f.id)}]:[]),
 ...vault.items.map(i=>({l:'Launch '+i.title,h:i.category,run:()=>launch(i.id)}))]}
function drawPalette(){
 let o=$('#ov');if(!palette){if(o)o.remove();return}
 const list=cmds().filter(c=>c.l.toLowerCase().includes(palette.q.toLowerCase()));
 if(!o){o=document.createElement('div');o.id='ov';o.className='overlay';document.body.append(o);
  o.onclick=e=>{if(e.target===o){palette=null;drawPalette()}}}
 o.innerHTML=`<div class="pal" role="dialog" aria-label="Command palette"><input id="q" placeholder="Type a command or credential name" value="${esc(palette.q)}">
 <div style="border-top:1px solid var(--line);padding:4px 0">${list.map((c,n)=>`<button class="${n===palette.i?'on':''}" data-n="${n}"><span>${esc(c.l)}</span><span class="mute">${esc(c.h||'')}</span></button>`).join('')||'<p class="mute" style="padding:8px 16px;margin:0">No matches</p>'}</div></div>`;
 const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);
 q.oninput=()=>{palette.q=q.value;palette.i=0;drawPalette()};
 q.onkeydown=e=>{
  if(e.key==='Escape'){palette=null;drawPalette()}
  else if(e.key==='ArrowDown'){e.preventDefault();palette.i=Math.min(palette.i+1,list.length-1);drawPalette()}
  else if(e.key==='ArrowUp'){e.preventDefault();palette.i=Math.max(palette.i-1,0);drawPalette()}
  else if(e.key==='Enter'&&list[palette.i]){const c=list[palette.i];palette=null;drawPalette();c.run()}};
 o.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const c=list[+b.dataset.n];palette=null;drawPalette();c.run()});
}
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&key){e.preventDefault();palette?(palette=null,drawPalette()):openPalette()}});
/* ── idle auto-lock + 1 s tick ── */
['pointerdown','pointermove','keydown','wheel'].forEach(t=>addEventListener(t,()=>{last=Date.now()},{passive:true}));
setInterval(()=>{
 if(!key)return;
 const left=Math.ceil(LOCK_SEC-(Date.now()-last)/1000);
 if(left<=0)return lock();
 hudTick();const lk=$('#lk');if(lk)lk.textContent='Unlocked · locks in '+fmt(left);
 for(const b of blocks)if(b.status==='active'){const r=remaining(b);if(r<=0){if(session&&session.id===b.id)finish();else{b.status='completed';render()}}else{const t=document.querySelector(`[data-t="${b.id}"]`);if(t)t.textContent=fmt(r)}}
 const t=$('#toast');
 if(clip){const r=Math.ceil((clip.end-Date.now())/1000);
  if(r<=0){clipWipe();if(t)t.innerHTML=''}
  else if(t)t.innerHTML=`<div class="toast">Password copied <span class="priv">(${esc(clip.label)})</span>. Clipboard clears in <b class="tn" style="color:var(--sig)">${r}s</b></div>`}
 else if(t)t.innerHTML='';
},1000);
/* ── TOTP (RFC 6238, HMAC-SHA1 via Web Crypto) ── */
function b32(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const c of s.replace(/=+$/,'').toUpperCase())bits+=A.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)}
async function totp(secret,t=Date.now()){const c=Math.floor(t/30000),buf=new ArrayBuffer(8),dv=new DataView(buf);dv.setUint32(0,Math.floor(c/2**32));dv.setUint32(4,c>>>0);
 const k=await crypto.subtle.importKey('raw',b32(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[19]&15;
 return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,'0')}
/* ── one-click workspace launch + session HUD ── */
async function launchWorkspace(id){
 const b=blocks.find(x=>x.id===id);
 b.ids.forEach((x,n)=>launch(x,n===0)); /* every tab opens synchronously, inside the click */
 const p=item(b.primary||b.ids[0]);
 await copySecret(JSON.parse(await decryptData(p.ct,p.iv,key)).password,p.title);
 const ti=[p,...b.ids.map(item)].find(i=>i&&i.tct);
 session={id,start:Date.now(),secret:ti?await decryptData(ti.tct,ti.tiv,key):null,open:true,code:'------'};
 drawHud();
}
function drawHud(){
 let h=$('#hud');const wb=$('#wb');if(wb)wb.style.bottom=session?'84px':'0';if(!session){if(h)h.remove();return}
 const b=blocks.find(x=>x.id===session.id);
 if(!h){h=document.createElement('div');h.id='hud';h.className='hud';h.setAttribute('role','region');h.setAttribute('aria-label','Active session');document.body.append(h)}
 h.innerHTML=`<div class="r"><div class="t"><b>${esc(b.title)}</b><span class="mute tn" id="ht"></span></div>
 ${session.open?(session.secret?`<svg class="wheel" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="hw" cx="18" cy="18" r="15" fill="none" stroke="var(--sig)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.25" transform="rotate(-90 18 18)"/></svg><button class="code tn" id="hc" data-a="ccopy" title="Copy code">------</button>`:'<span class="mute">No 2FA secret on these credentials</span>'):''}
 <button class="ghost" data-a="hcol" aria-expanded="${session.open}">${session.open?'Collapse':'Expand'}</button>
 ${session.open?'<button class="btn" data-a="finish">Complete block</button>':''}</div>`;
 hudTick();
}
async function hudTick(){
 if(!session)return;const b=blocks.find(x=>x.id===session.id),t=$('#ht');if(t)t.textContent=fmt(remaining(b))+' left';
 if(!session.open||!session.secret)return;
 const now=Date.now(),s=30-Math.floor(now/1000)%30,c=await totp(session.secret,now);session.code=c;
 const hc=$('#hc');if(hc)hc.textContent=c.slice(0,3)+' '+c.slice(3);
 const hw=$('#hw');if(hw){hw.style.transition=s===30?'none':'stroke-dashoffset 1s linear';hw.style.strokeDashoffset=94.25*(1-s/30)}
}
function finish(){
 const b=blocks.find(x=>x.id===session.id);b.status='completed';b.spent=Math.round((Date.now()-session.start)/1000);
 session=null;drawHud();clipWipe();render();
}
/* ── in-app browser: tabs inside the page (no Safari) ── */
const BLOCKED=/(^|\.)(google\.com|youtube\.com|youtu\.be|github\.com|stripe\.com|outlook\.com|office\.com|reddit\.com|netflix\.com|whatsapp\.com|tiktok\.com|openai\.com|claude\.ai|anthropic\.com|discord\.com|notion\.so|slack\.com|dropbox\.com|spotify\.com|bing\.com|yahoo\.com|facebook\.com|instagram\.com|x\.com|twitter\.com|linkedin\.com|microsoft\.com|live\.com|apple\.com|amazon\.com|paypal\.com)$/i;
const hostOf=u=>{try{return new URL(u).hostname}catch{return''}};
const webCur=()=>web&&web.tabs.find(t=>t.id===web.active);
function normalize(q){q=q.trim();if(!q)return null;let u=q;if(!/^https?:\/\//i.test(q))u=/^\S+\.[a-z]{2,}(\/\S*)?$/i.test(q)?'https://'+q:'https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(q);try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}}
function openWeb(url,focus=true){web=web||{tabs:[],active:null,show:true};const t={id:'t'+(++tabN),url};web.tabs.push(t);if(focus||!web.active)web.active=t.id;web.show=true;drawWeb()}
function drawWeb(){
 let w=$('#wb');const c=webCur();
 if(!web||!web.show||!key||!c){if(w)w.remove();return}
 if(!w){w=document.createElement('div');w.id='wb';w.className='web';w.setAttribute('role','dialog');w.setAttribute('aria-label','In-app browser');document.body.append(w)}
 w.style.bottom=session?'84px':'0';
 const h=c.url?hostOf(c.url):'';
 const body=!c.url?`<div class="qgrid">${vault.items.filter(i=>i.url).map(i=>`<button class="card" style="margin:0;text-align:left" data-a="wgo" data-id="${i.id}"><b>${esc(i.title)}</b><div class="mute">${esc(hostOf(i.url))}</div></button>`).join('')}</div><p class="mute" style="padding:0 16px">${standalone?'Pages open in the iPhone in-app browser (tap Done to come back). ':''}Type an address or a search in the bar. (This demo searches Wikipedia; the real app uses a search API.)</p>`
 :BLOCKED.test(h)?`<div class="wcard"><h2>${esc(h)} can't be shown inside another page</h2><p class="mute">Large sites refuse to be embedded, for security. In the installed iPhone/Android app this opens in the built-in browser sheet instead.</p><button class="btn" data-a="wext">Open in browser</button></div>`
 :`<iframe src="${esc(c.url)}" sandbox="allow-scripts allow-forms allow-same-origin allow-popups" referrerpolicy="no-referrer" title="${esc(h)}"></iframe>`;
 w.innerHTML=`<div class="tabs">${web.tabs.map(t=>`<span class="tab ${t.id===web.active?'on':''}"><button data-a="wtab" data-id="${t.id}">${esc(t.url?hostOf(t.url):'New tab')}</button><button data-a="wx" data-id="${t.id}" aria-label="Close tab">×</button></span>`).join('')}<button class="ghost" data-a="wnew" aria-label="New tab">+</button><button class="ghost" data-a="wclose" style="margin-left:auto">Done</button></div>
 <form id="wf" class="bar"><input id="wq" value="${esc(c.url)}" placeholder="Search or enter address" aria-label="Address or search" autocomplete="off"><button class="btn">Go</button></form>
 <div class="wbody">${body}</div>${c.url&&!BLOCKED.test(h)?'<div class="wfoot">Blank page? Some sites refuse to be embedded. <button class="link" data-a="wext">Open in browser</button></div>':''}`;
}
document.addEventListener('submit',e=>{if(e.target.id!=='wf')return;e.preventDefault();const u=normalize($('#wq').value),c=webCur();if(u&&c){if(standalone)window.open(u,'_blank','noopener,noreferrer');else{c.url=u;drawWeb()}}});
showLock();
</script>
</body>
