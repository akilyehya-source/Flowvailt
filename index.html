const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── crypto: same scheme as crypto.ts (PBKDF2-SHA256 600k → AES-GCM 256) ── */
async function deriveKey(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw.normalize('NFKC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(t,k){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(t));return{ciphertext:b64(new Uint8Array(c)),iv:b64(iv)}}
async function decryptData(c,iv,k){return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(c)))}

  vault={salt:b64(salt),verifier,items};saveVault();
 }else{

 }

 key=k;last=Date.now();render();
}

function drawPalette(){

 if(!o){o=document.createElement('div');o.id='ov';o.className='overlay';document.body.append(o);

/* ── TOTP (RFC 6238, HMAC-SHA1 via Web Crypto) ── */
function b32(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const c of s.replace(/=+$/,'').toUpperCase())bits+=A.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)}
async function totp(secret,t=Date.now()){const c=Math.floor(t/30000),buf=new ArrayBuffer(8),dv=new DataView(buf);dv.setUint32(0,Math.floor(c/2**32));dv.setUint32(4,c>>>0);
 const k=await crypto.subtle.importKey('raw',b32(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[19]&15;
 return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,'0')}

async function saveNote(n){

 const id=n.id||('n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),at=Date.now();

async function deleteNote(id){vault.notes=(vault.notes||[]).filter(x=>x.id!==id);saveVault();notes=notes.filter(x=>x.id!==id)}
async function flushDraft(){

function fillNoteList(){
 const q=(noteUI.q||'').toLowerCase(),el=$('#nlist');if(!el)return;
 const list=notes.filter(n=>!q||(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>b.at-a.at);
 el.innerHTML=list.length?list.map(n=>{const b=blocks.find(x=>x.id===n.block);return`<button class="ni" data-a="nopen" data-id="${n.id}"><b class="priv">${esc(noteTitle(n))}</b><p class="priv">${esc((n.body||'').slice(0,160))}</p><div class="mute" style="margin-top:6px">${new Date(n.at).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}${b?' · '+esc(b.title):''}</div></button>`}).join(''):'<p class="mute">No notes yet. Tap + New to write one.</p>'}

  w.innerHTML=`<div class="tabs"><b style="padding:0 6px">Notes</b><button class="btn" data-a="nnew" style="padding:5px 12px">+ New</button><button class="ghost" data-a="nclose" style="margin-left:auto">Done</button></div>
  <div class="bar"><input id="nq" value="${esc(noteUI.q||'')}" placeholder="Search notes" aria-label="Search notes" autocomplete="off"></div>
  <div class="wbody"><div class="nlist" id="nlist"></div></div>`;fillNoteList();

  const n=notes.find(x=>x.id===noteUI.id)||{title:'',body:'',block:noteUI.block||null};
  w.innerHTML=`<div class="tabs"><button class="ghost" data-a="nback">‹ Back</button><button class="btn" data-a="nsave" style="padding:5px 12px">Save</button>${noteUI.id?`<button class="ghost" data-a="ndel" style="margin-left:auto">${noteUI.confirm?'Tap again to delete':'Delete'}</button>`:''}</div>
  <div class="ned"><input id="nti" value="${esc(n.title)}" placeholder="Title" aria-label="Title" autocomplete="off"><textarea id="ntb" placeholder="Write your note. It is encrypted on this device." aria-label="Note">${esc(n.body)}</textarea>
  <select id="ntl" aria-label="Link to block"><option value="">Not linked to a block</option>${blocks.map(b=>`<option value="${b.id}" ${n.block===b.id?'selected':''}>${esc(b.title)}</option>`).join('')}</select></div>`;
  if(!noteUI.id&&!n.title&&!n.body)$('#nti').focus();

<script>
/* ───────── FlowVault Library: 3D shelves, encrypted PDF storage, reader and annotation tools ───────── */
(()=>{
'use strict';
const CDN='https://cdnjs.cloudflare.com/ajax/libs/';
const L={books:[],q:'',sort:'added',cur:null,libsP:null,dbP:null,penOnly:false,inv:false,open:false,detail:null};
const COLORS=['#ffd84d','#ff6b6b','#5fe08f','#5aa9ff','#1f1f1f'];
const q$=(s,r=document)=>r.querySelector(s);
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function msg(t,ms=3200){const m=document.createElement('div');m.className='msg';m.setAttribute('role','status');m.textContent=t;document.body.append(m);setTimeout(()=>m.remove(),ms)}

/* ── encrypted storage (IndexedDB). Every record is AES-GCM encrypted with the vault key. ── */
const db=()=>L.dbP||(L.dbP=new Promise((ok,no)=>{const r=indexedDB.open('flowvault-lib',1);r.onupgradeneeded=()=>{for(const s of ['meta','data','ann'])r.result.createObjectStore(s)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
const idbGet=async(s,k)=>rq((await db()).transaction(s).objectStore(s).get(k));
const idbPut=async(s,k,v)=>{const t=(await db()).transaction(s,'readwrite');t.objectStore(s).put(v,k);return done(t)};
const idbDel=async k=>{const t=(await db()).transaction(['meta','data','ann'],'readwrite');for(const s of ['meta','data','ann'])t.objectStore(s).delete(k);return done(t)};
const idbAll=async s=>{const st=(await db()).transaction(s).objectStore(s);const [ks,vs]=await Promise.all([rq(st.getAllKeys()),rq(st.getAll())]);return ks.map((k,i)=>({k,v:vs[i]}))};
const encB=async b=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,b)}};
const decB=r=>crypto.subtle.decrypt({name:'AES-GCM',iv:r.iv},key,r.ct);
const encJ=o=>encB(enc.encode(JSON.stringify(o)));
const decJ=async r=>JSON.parse(dec.decode(await decB(r)));
const saveMeta=async b=>idbPut('meta',b.id,await encJ(b));
async function loadBooks(){
 const rows=await idbAll('meta'),out=[];
 for(const r of rows){try{out.push(await decJ(r.v))}catch{}}
 L.books=out;
}

/* ── PDF libraries: loaded on first use, from this site first, then a CDN ── */
function loadScript(srcs){return new Promise((ok,no)=>{let i=0;const next=()=>{if(i>=srcs.length)return no(new Error('Could not load '+srcs[0]));const s=document.createElement('script');s.src=srcs[i++];s.onload=()=>ok();s.onerror=()=>{s.remove();next()};document.head.append(s)};next()})}
function libs(){
 if(L.libsP)return L.libsP;
 L.libsP=(async()=>{
  await Promise.all([loadScript(['lib-pdf.min.js',CDN+'pdf.js/3.11.174/pdf.min.js']),loadScript(['lib-pdf-lib.min.js',CDN+'pdf-lib/1.17.1/pdf-lib.min.js'])]);
  let w=null;
  for(const u of ['lib-pdf.worker.min.js',CDN+'pdf.js/3.11.174/pdf.worker.min.js']){try{const r=await fetch(u);if(r.ok){w=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));break}}catch{}}
  if(!w)throw new Error('Could not load the PDF engine');
  pdfjsLib.GlobalWorkerOptions.workerSrc=w;
 })();
 L.libsP.catch(()=>{L.libsP=null});
 return L.libsP;
}

/* ── colour + geometry of a book ── */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),l=(m+n)/2;let h=0,s=0;if(m!==n){const d=m-n;s=l>.5?d/(2-m-n):d/(m+n);h=m===r?(g-b)/d+(g<b?6:0):m===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}
function pickColor(cv,title){
 const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(cv,0,0,8,8);const d=x.getImageData(0,0,8,8).data;
 let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/4;
 let {h,s,l}=rgb2hsl(r/n,g/n,b/n);
 if(s<.18)h=hash(title)%360;
 return{h:Math.round(h),s:Math.min(.62,Math.max(.38,s)),l:Math.min(.36,Math.max(.22,l*.55))};
}
const dims=(b,k=1)=>{
 const t=Math.round(Math.max(17,Math.min(58,10+b.pages*.55))*k),
  h=Math.round((136+(hash(b.id)%4)*11+(b.aspect<.62?14:0))*k),
  d=Math.round(Math.max(72,Math.min(128,h*b.aspect))*(k>1?1:1));
 return{t,h,d};
};
const spineFont=(title,t,h)=>{const avail=h-44,len=Math.max(1,[...title].length);return Math.round(Math.max(9,Math.min(t*.34+2,avail/(len*.56)))*10)/10};
const spineText=(title,t,h)=>{const avail=h-44,max=Math.floor(avail/(9*.56)),a=[...title];return a.length>max?a.slice(0,Math.max(3,max-1)).join('').trim()+'…':title};
function bookEl(b,k=1,tag='button'){
 const {t,h,d}=dims(b,k),c=b.color||{h:30,s:.4,l:.3},hs=(l)=>`hsl(${c.h} ${Math.round(c.s*100)}% ${Math.round(l*100)}%)`;
 const pct=b.page&&b.pages?Math.min(100,Math.round(100*(b.page-1)/Math.max(1,b.pages-1))):0;
 const el=document.createElement(tag);
 el.dataset.id=b.id;
 el.style.cssText=`--t:${t}px;--h:${h}px;--d:${d}px;--c:${hs(c.l)};--cd:${hs(c.l*.62)};--cl:${hs(Math.min(.55,c.l*1.28))};--ink:#f4e6c6`;
 el.innerHTML=`<div class="bk" style="--t:${t}px;--h:${h}px;--d:${d}px;--c:${hs(c.l)};--cd:${hs(c.l*.62)};--cl:${hs(Math.min(.55,c.l*1.28))};--ink:#f4e6c6">
  <div class="f sp"><span class="priv" style="font-size:${spineFont(b.title,t,h)}px">${esc(spineText(b.title,t,h))}</span><i style="width:${pct}%"></i></div><div class="f bs"></div>
  <div class="f fc" style="background-image:url(${b.cover})"></div><div class="f bc"></div><div class="f tp"></div></div>`;
 return el;
}

/* ── library screen ── */
function layoutRows(avail,list,k){
 const rows=[[]];let used=0;
 for(const b of list){const w=dims(b,k).t+1;if(used+w>avail&&rows.at(-1).length){rows.push([]);used=0}rows.at(-1).push(b);used+=w}
 while(rows.length<3||rows.at(-1).length)rows.push([]);
 return rows.slice(0,Math.max(3,rows.length));
}
function sorted(){
 const ql=L.q.trim().toLowerCase();
 let a=L.books.filter(b=>!ql||b.title.toLowerCase().includes(ql));
 if(L.sort==='title')a.sort((x,y)=>x.title.localeCompare(y.title));
 else if(L.sort==='recent')a.sort((x,y)=>(y.last||0)-(x.last||0));
 else a.sort((x,y)=>x.added-y.added);
 return a;
}
function drawLib(){
 let w=q$('#lib');
 if(!key||!L.open){if(w)w.remove();return}
 if(!w){w=document.createElement('div');w.id='lib';w.className='web';w.setAttribute('role','dialog');w.setAttribute('aria-label','Library');document.body.append(w);
  w.innerHTML=`<div class="tabs"><b style="padding:0 6px">Library</b><span class="mute" id="lcount"></span>
   <label class="btn" for="lfile" style="padding:6px 12px;cursor:pointer">+ Add PDF</label><input id="lfile" type="file" accept="application/pdf,.pdf" multiple hidden>
   <input type="search" id="lq" placeholder="Search books" aria-label="Search books" autocomplete="off">
   <select id="lsort" aria-label="Sort"><option value="added">Added</option><option value="title">Title</option><option value="recent">Recent</option></select>
   <button class="ghost" data-l="lclose">Done</button></div>
   <div class="room" id="room"><div class="rows" id="lrows"></div></div>`;}
 w.className='web'+(privacy?' blur':'');
 w.style.bottom=session?'84px':'0';
 fillLib();
}
function fillLib(){
 const w=q$('#lib');if(!w)return;
 const room=q$('#room'),rows=q$('#lrows');
 const bytes=L.books.reduce((a,b)=>a+(b.size||0),0);
 q$('#lcount').textContent=L.books.length?L.books.length+(L.books.length===1?' book':' books')+' · '+kb(bytes)+(L.persisted===true?' · saved on this device':L.persisted===false?' · storage may be cleared by iOS':''):'';
 q$('#lsort').value=L.sort;
 const k=room.clientWidth<520?.8:1,shelfW=Math.min(980,room.clientWidth-16);
 const list=sorted(),R=layoutRows(shelfW-34,list,k);
 rows.innerHTML='';
 if(!L.books.length){const e=document.createElement('div');e.className='lempty';e.innerHTML='<b>Your library is empty</b><p>Tap “+ Add PDF” to put your first book on the shelf. Books are encrypted on this device with your vault key.</p>';rows.append(e)}
 for(const row of R){
  const s=document.createElement('div');s.className='shelf';s.style.width=shelfW+'px';s.style.height=Math.round(212*k)+'px';
  s.innerHTML='<div class="back"></div><div class="sl"></div><div class="sr"></div><div class="floor"></div><div class="plank"></div><div class="books"></div>';
  const bs=q$('.books',s);
  for(const b of row){const el=bookEl(b,k,'button');el.className='slot';el.setAttribute('aria-label','Open '+b.title);el.dataset.l='bopen';bs.append(el)}
  rows.append(s);

}

/* ── adding books ── */
async function coverOf(doc){
 const p=await doc.getPage(1),v1=p.getViewport({scale:1}),sc=300/v1.width,vp=p.getViewport({scale:sc});
 const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
 const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
 await p.render({canvasContext:cx,viewport:vp}).promise;
 return{cv,aspect:v1.width/v1.height,thumb:cv.toDataURL('image/jpeg',.8)};
}
async function addOne(file){
 await libs();
 const buf=await file.arrayBuffer();
 if(new TextDecoder().decode(new Uint8Array(buf,0,Math.min(1024,buf.byteLength))).indexOf('%PDF-')<0)throw new Error(file.name+' is not a PDF');
 let doc;
 try{doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise}
 catch(e){throw new Error(e&&e.name==='PasswordException'?file.name+' is password-protected. Remove its password first, then add it.':file.name+' could not be opened')}
 const c=await coverOf(doc);
 let title='';try{const m=await doc.getMetadata();title=(m.info&&m.info.Title||'').trim()}catch{}
 if(title.length<2)title=file.name.replace(/\.pdf$/i,'');
 const id='bk'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const meta={id,title:title.slice(0,120),pages:doc.numPages,size:buf.byteLength,added:Date.now(),last:null,page:1,zoom:1,aspect:c.aspect,cover:c.thumb,color:pickColor(c.cv,title)};
 doc.destroy();
 await idbPut('data',id,await encB(buf));
 await saveMeta(meta);
 L.books.push(meta);
}
async function addFiles(files){
 const list=[...files];if(!list.length)return;
 msg('Encrypting and adding '+list.length+(list.length>1?' books…':' book…'),20000);
 let ok=0;
 for(const f of list){try{await addOne(f);ok++;fillLib()}catch(e){msg(e.message||'Could not add the file',5000)}}
 document.querySelectorAll('.msg').forEach(m=>{if(/^Encrypting/.test(m.textContent))m.remove()});
 if(ok)msg(ok+(ok>1?' books added':' book added'));
 fillLib();
}

/* ── book detail (pull a book off the shelf) ── */
function showDetail(id){
 const b=L.books.find(x=>x.id===id);if(!b)return;
 L.detail={id,confirm:false};
 const w=q$('#lib');let d=q$('.bdet',w);if(d)d.remove();
 d=document.createElement('div');d.className='bdet';
 const pct=b.page?Math.round(100*(b.page-1)/Math.max(1,b.pages-1)):0;
 d.innerHTML=`<div class="stage" id="stage"></div>
  <input class="ttl priv" id="ltitle" value="${esc(b.title)}" aria-label="Title" maxlength="120">
  <div class="meta">${b.pages} pages · ${kb(b.size)}${b.last?' · last read '+new Date(b.last).toLocaleDateString():''}</div>
  <div class="bar2" aria-label="Progress"><i style="width:${pct}%"></i></div>
  <div class="acts"><button class="btn" data-l="bread">${b.last?'Continue reading':'Read'}</button><button class="ghost" data-l="bexport">Save a copy</button><button class="ghost" data-l="bdel" id="bdel">Delete</button><button class="ghost" data-l="bclose">Close</button></div>`;
 w.append(d);
 const el=bookEl(b,1.75,'div');el.className='';const bk=q$('.bk',el);bk.classList.add('spin');q$('#stage',d).append(bk);
 // drag to spin the book
 const st=q$('#stage',d);let ry=-40,rx=-8,sx=0,sy=0,drag=false;
 st.onpointerdown=e=>{drag=true;sx=e.clientX;sy=e.clientY;bk.classList.remove('spin');bk.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;st.setPointerCapture(e.pointerId)};
 st.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-sx)*.6;rx=Math.max(-50,Math.min(30,rx-(e.clientY-sy)*.4));sx=e.clientX;sy=e.clientY;bk.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`};
 st.onpointerup=st.onpointercancel=()=>{drag=false};
 q$('#ltitle',d).onchange=async e=>{const v=e.target.value.trim();if(v&&v!==b.title){b.title=v.slice(0,120);await saveMeta(b);fillLib()}else e.target.value=b.title};
}
function closeDetail(){const d=q$('#lib .bdet');if(d)d.remove();L.detail=null}

/* ── reader ── */
const RS=()=>q$('#rs');
const ZMIN=.5,ZMAX=3.5;
async function openBook(id){
 const b=L.books.find(x=>x.id===id);if(!b)return;
 try{
  await libs();
  const rec=await idbGet('data',id);if(!rec)throw new Error('Book data is missing');
  const bytes=new Uint8Array(await decB(rec));
  let ann={};try{const a=await idbGet('ann',id);if(a)ann=await decJ(a)}catch{}
  L.cur={b,bytes,ann,doc:null,sizes:[],tool:'hand',color:COLORS[0],size:1,undo:[],redo:[],zoom:b.zoom||1,obs:null,queue:[],busy:0,text:[],rtok:0,saveT:0,sTok:0};
  await openDoc();
  b.last=Date.now();saveMeta(b);
  closeDetail();drawReader();
 }catch(e){msg(e.message||'Could not open this book',5000)}
}
async function openDoc(){
 const c=L.cur;if(c.doc){try{c.doc.destroy()}catch{}}
 c.doc=await pdfjsLib.getDocument({data:c.bytes.slice()}).promise;
 c.b.pages=c.doc.numPages;
 const p1=await c.doc.getPage(1),v=p1.getViewport({scale:1});
 c.sizes=Array.from({length:c.doc.numPages},()=>({w:v.width,h:v.height}));
 c.sizes[0]={w:v.width,h:v.height};c.text=[];
 (async()=>{const tok=++c.sTok;for(let i=1;i<c.doc.numPages;i++){if(tok!==c.sTok||L.cur!==c)return;try{const p=await c.doc.getPage(i+1),vv=p.getViewport({scale:1});const s=c.sizes[i];if(Math.abs(s.w-vv.width)>1||Math.abs(s.h-vv.height)>1){c.sizes[i]={w:vv.width,h:vv.height};const el=q$(`#rs .pg[data-i="${i}"]`);if(el)el.style.aspectRatio=vv.width+'/'+vv.height}}catch{}if(i%25===0)await new Promise(r=>setTimeout(r));}})();
}
function pageW(){const rs=RS();return Math.max(200,Math.round((rs.clientWidth-16)*L.cur.zoom))}
function drawReader(){
 const c=L.cur;let w=q$('#rd');if(w)w.remove();
 w=document.createElement('div');w.id='rd';w.className='web';w.setAttribute('role','dialog');w.setAttribute('aria-label','Reader');
 w.style.bottom=session?'84px':'0';
 const tb=(t,l)=>`<button class="ghost tool${t==='hand'?' on':''}" data-l="tool" data-t="${t}">${l}</button>`;
 w.innerHTML=`<div class="rbar"><button class="ghost" data-l="rclose" aria-label="Back to library">‹<span class="lbl"> Library</span></button><b class="rt priv">${esc(c.b.title)}</b><button class="ghost tn" data-l="rgoto" id="rpg">1 / ${c.doc.numPages}</button><button class="ghost" data-l="rsearch" aria-label="Search in book">🔍<span class="lbl"> Search</span></button><button class="ghost" data-l="zout" aria-label="Zoom out">−</button><button class="ghost" data-l="zin" aria-label="Zoom in">+</button><button class="ghost" data-l="rmore" aria-label="More">⋯</button></div>
 <div class="rbar">${tb('hand','Read')}${tb('hl','Highlight')}${tb('pen','Pen')}${tb('text','Text')}${tb('erase','Erase')}<span class="rsep"></span>${COLORS.map((x,i)=>`<button class="sw${i?'':' on'}" data-l="color" data-c="${x}" style="background:${x}" aria-label="Colour ${i+1}"></button>`).join('')}<select id="rsize" aria-label="Size"><option value="0">Thin</option><option value="1" selected>Medium</option><option value="2">Thick</option></select><span class="rsep"></span><button class="ghost" data-l="undo">Undo</button><button class="ghost" data-l="redo">Redo</button></div>
 <div class="rscroll${L.inv?' inv':''}" id="rs"></div>`;
 document.body.append(w);
 const rs=RS();rs.style.setProperty('--pw',pageW()+'px');
 const n=c.doc.numPages;
 for(let i=0;i<n;i++){
  const pg=document.createElement('div');pg.className='pg';pg.dataset.i=i;pg.style.aspectRatio=c.sizes[i].w+'/'+c.sizes[i].h;
  pg.innerHTML='<canvas class="pc"></canvas><canvas class="ac"></canvas><span class="pn">'+(i+1)+'</span>';rs.append(pg);
 }
 setupObserver();
 bindDraw();
 rs.addEventListener('scroll',onScroll,{passive:true});
 const first=Math.max(0,(c.b.page||1)-1);
 requestAnimationFrame(()=>{const t=q$(`#rs .pg[data-i="${first}"]`);if(t)rs.scrollTop=t.offsetTop-8;updatePg()});
}
function setupObserver(){
 const c=L.cur,rs=RS();
 if(c.obs)c.obs.disconnect();
 c.obs=new IntersectionObserver(es=>{
  for(const e of es){const pg=e.target,i=+pg.dataset.i;
   if(e.isIntersecting)queueRender(i);
   else release(pg,i);
  }
 },{root:rs,rootMargin:'120% 0px'});
 rs.querySelectorAll('.pg').forEach(p=>c.obs.observe(p));
}
function queueRender(i){const c=L.cur;if(!c||c.queue.includes(i))return;c.queue.push(i);pump()}
function pump(){
 const c=L.cur;if(!c)return;
 while(c.busy<2&&c.queue.length){const i=c.queue.shift();c.busy++;renderPage(i).catch(()=>{}).finally(()=>{c.busy--;pump()})}
}
function release(pg,i){
 const c=L.cur;if(!c)return;
 c.queue=c.queue.filter(x=>x!==i);
 if(pg._task){try{pg._task.cancel()}catch{}pg._task=null}
 const pc=q$('.pc',pg),ac=q$('.ac',pg);
 if(pc&&pc.width){pc.width=0;pc.height=0;pg.dataset.r=''}
 if(ac&&ac.width){ac.width=0;ac.height=0}
}
async function renderPage(i){
 const c=L.cur;if(!c)return;
 const pg=q$(`#rs .pg[data-i="${i}"]`);if(!pg)return;
 const cssW=pg.clientWidth||pageW();
 const key2=cssW+'|'+c.rtok;if(pg.dataset.r===key2&&q$('.pc',pg).width)return;
 const page=await c.doc.getPage(i+1);if(L.cur!==c||!pg.isConnected)return;
 const v1=page.getViewport({scale:1});
 c.sizes[i]={w:v1.width,h:v1.height};pg.style.aspectRatio=v1.width+'/'+v1.height;
 let sc=cssW/v1.width*Math.min(devicePixelRatio||1,2);
 const px=v1.width*sc*v1.height*sc;if(px>12e6)sc*=Math.sqrt(12e6/px);
 const vp=page.getViewport({scale:sc}),pc=q$('.pc',pg);
 pc.width=Math.round(vp.width);pc.height=Math.round(vp.height);
 const cx=pc.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,pc.width,pc.height);
 const task=page.render({canvasContext:cx,viewport:vp});pg._task=task;
 try{await task.promise}catch(e){if(e&&e.name==='RenderingCancelledException')return;throw e}
 pg._task=null;pg.dataset.r=key2;
 drawAnn(i);
}
function rerenderAll(){const c=L.cur;c.rtok++;const rs=RS();rs.querySelectorAll('.pg').forEach(pg=>{const i=+pg.dataset.i;pg.dataset.r='';const r=pg.getBoundingClientRect(),b=rs.getBoundingClientRect();if(r.bottom>b.top-b.height&&r.top<b.bottom+b.height)queueRender(i)})}
function curPage(){
 const rs=RS();if(!rs)return 1;const pgs=rs.querySelectorAll('.pg'),mid=rs.scrollTop+rs.clientHeight*.3;
 let lo=0,hi=pgs.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(pgs[m].offsetTop<=mid)lo=m;else hi=m-1}
 return lo+1;
}
function updatePg(){const c=L.cur;if(!c)return;const p=curPage(),b=q$('#rpg');if(b)b.textContent=p+' / '+c.doc.numPages;return p}
let scrollT=0;
function onScroll(){
 const c=L.cur;if(!c)return;const p=updatePg();clearTimeout(scrollT);
 scrollT=setTimeout(()=>{if(L.cur===c&&c.b.page!==p){c.b.page=p;c.b.last=Date.now();saveMeta(c.b).catch(()=>{})}},700);
}
function goPage(p){const c=L.cur,rs=RS();p=Math.max(1,Math.min(c.doc.numPages,p));const t=q$(`#rs .pg[data-i="${p-1}"]`);if(t)rs.scrollTop=t.offsetTop-8}
function setZoom(z){
 const c=L.cur,rs=RS();z=Math.max(ZMIN,Math.min(ZMAX,Math.round(z*100)/100));if(z===c.zoom)return;
 const ratio=rs.scrollTop/Math.max(1,rs.scrollHeight);
 c.zoom=z;c.b.zoom=z;rs.style.setProperty('--pw',pageW()+'px');
 rs.scrollTop=ratio*rs.scrollHeight;rerenderAll();saveMeta(c.b).catch(()=>{});
}

/* ── annotations ──
   objects: {t:'pen',c,w,p:[[x,y]..]}  {t:'hl',c,r:[x,y,w,h]}  {t:'tx',c,fs,x,y,s}
   positions are 0..1 of the displayed page; widths and font sizes are PDF points. */
const PEN_W=[1.5,3,6],TXT_S=[11,15,22];
function drawAnn(i,live){
 const c=L.cur;if(!c)return;const pg=q$(`#rs .pg[data-i="${i}"]`);if(!pg)return;
 const pc=q$('.pc',pg),ac=q$('.ac',pg);if(!pc.width)return;
 if(ac.width!==pc.width||ac.height!==pc.height){ac.width=pc.width;ac.height=pc.height}
 const cx=ac.getContext('2d'),W=ac.width,H=ac.height,s=W/c.sizes[i].w;
 cx.clearRect(0,0,W,H);
 const list=(c.ann[i]||[]).concat(live?[live]:[]);
 for(const o of list){
  if(o.t==='hl'){cx.globalAlpha=.38;cx.fillStyle=o.c;cx.fillRect(o.r[0]*W,o.r[1]*H,o.r[2]*W,o.r[3]*H);cx.globalAlpha=1}
  else if(o.t==='pen'){cx.strokeStyle=o.c;cx.lineWidth=o.w*s;cx.lineCap=cx.lineJoin='round';cx.beginPath();const p=o.p;cx.moveTo(p[0][0]*W,p[0][1]*H);
   if(p.length===1)cx.lineTo(p[0][0]*W+.01,p[0][1]*H);
   for(let k=1;k<p.length-1;k++){const mx=(p[k][0]+p[k+1][0])/2*W,my=(p[k][1]+p[k+1][1])/2*H;cx.quadraticCurveTo(p[k][0]*W,p[k][1]*H,mx,my)}
   if(p.length>1)cx.lineTo(p.at(-1)[0]*W,p.at(-1)[1]*H);cx.stroke()}
  else if(o.t==='tx'){cx.fillStyle=o.c;cx.textBaseline='top';cx.font=`${o.fs*s}px -apple-system,"Segoe UI",system-ui,sans-serif`;o.s.split('\n').forEach((ln,k)=>cx.fillText(ln,o.x*W,o.y*H+k*o.fs*s*1.2))}
 }
}
function bbox(i,o){
 const c=L.cur,pg=q$(`#rs .pg[data-i="${i}"]`),W=pg.clientWidth,H=pg.clientHeight,s=W/c.sizes[i].w;
 if(o.t==='hl')return[o.r[0]*W,o.r[1]*H,o.r[2]*W,o.r[3]*H];
 if(o.t==='tx'){const ls=o.s.split('\n'),mw=Math.max(...ls.map(l=>l.length))*o.fs*s*.55;return[o.x*W,o.y*H,mw,ls.length*o.fs*s*1.2]}
 return null;
}
function hit(i,o,px,py){
 const pg=q$(`#rs .pg[data-i="${i}"]`),W=pg.clientWidth,H=pg.clientHeight,pad=10;
 if(o.t==='pen'){const r=pad+o.w*W/L.cur.sizes[i].w/2;for(let k=0;k<o.p.length;k++){const ax=o.p[k][0]*W,ay=o.p[k][1]*H;
   if(Math.hypot(ax-px,ay-py)<r)return true;
   if(k){const bx=o.p[k-1][0]*W,by=o.p[k-1][1]*H,dx=ax-bx,dy=ay-by,l2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((px-bx)*dx+(py-by)*dy)/l2));if(Math.hypot(bx+t*dx-px,by+t*dy-py)<r)return true}}
  return false}
 const b=bbox(i,o);return px>=b[0]-pad&&px<=b[0]+b[2]+pad&&py>=b[1]-pad&&py<=b[1]+b[3]+pad;
}
async function saveAnn(){
 const c=L.cur;if(!c||!key)return;
 try{await idbPut('ann',c.b.id,await encJ(c.ann))}catch{}
}
function pushAct(a){const c=L.cur;c.undo.push(a);if(c.undo.length>200)c.undo.shift();c.redo=[]}
function addObj(i,o){const c=L.cur;(c.ann[i]=c.ann[i]||[]).push(o);pushAct({k:'add',i,o});drawAnn(i);saveAnn()}
function delObj(i,o,record=true){const c=L.cur,l=c.ann[i]||[],at=l.indexOf(o);if(at<0)return;l.splice(at,1);if(!l.length)delete c.ann[i];if(record)pushAct({k:'del',i,o,at});drawAnn(i);saveAnn()}
function undo(){const c=L.cur,a=c.undo.pop();if(!a)return;
 if(a.k==='add'){const l=c.ann[a.i]||[],at=l.indexOf(a.o);if(at>=0){l.splice(at,1);if(!l.length)delete c.ann[a.i]}}
 else{(c.ann[a.i]=c.ann[a.i]||[]).splice(Math.min(a.at,(c.ann[a.i]||[]).length),0,a.o)}
 c.redo.push(a);drawAnn(a.i);saveAnn()}
function redo(){const c=L.cur,a=c.redo.pop();if(!a)return;
 if(a.k==='add'){(c.ann[a.i]=c.ann[a.i]||[]).push(a.o)}
 else{const l=c.ann[a.i]||[],at=l.indexOf(a.o);if(at>=0){l.splice(at,1);if(!l.length)delete c.ann[a.i]}}
 c.undo.push(a);drawAnn(a.i);saveAnn()}
function setTool(t){
 const c=L.cur,rs=RS();c.tool=t;
 document.querySelectorAll('#rd .tool').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 rs.classList.toggle('tool',t!=='hand');rs.classList.toggle('pen',L.penOnly);
}
function bindDraw(){
 const rs=RS();let st=null;
 const pos=(e,ac)=>{const r=ac.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};
 rs.addEventListener('pointerdown',e=>{
  const c=L.cur,ac=e.target.closest&&e.target.closest('.ac');if(!ac||c.tool==='hand')return;
  if(L.penOnly&&e.pointerType==='touch')return;
  const pg=ac.parentElement,i=+pg.dataset.i;
  if(e.target.classList&&e.target.classList.contains('ti'))return;
  e.preventDefault();ac.setPointerCapture(e.pointerId);
  const p=pos(e,ac);
  if(c.tool==='pen')st={i,o:{t:'pen',c:c.color,w:PEN_W[c.size],p:[p]},ac};
  else if(c.tool==='hl')st={i,o:{t:'hl',c:c.color,r:[p[0],p[1],0,0]},a:p,ac};
  else if(c.tool==='erase')st={i,ac,erased:false,rect:ac.getBoundingClientRect()};
  else if(c.tool==='text')st={i,ac,p,txt:true};
  if(st&&c.tool==='erase')eraseAt(st,e);
 });
 rs.addEventListener('pointermove',e=>{
  if(!st||st.txt)return;
  if(st.o&&st.o.t==='pen'){const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of (evs.length?evs:[e]))st.o.p.push(pos(ev,st.ac));drawAnn(st.i,st.o)}
  else if(st.o&&st.o.t==='hl'){const p=pos(e,st.ac);st.o.r=[Math.min(st.a[0],p[0]),Math.min(st.a[1],p[1]),Math.abs(p[0]-st.a[0]),Math.abs(p[1]-st.a[1])];drawAnn(st.i,st.o)}
  else if(L.cur.tool==='erase')eraseAt(st,e);
 });
 const end=e=>{
  if(!st)return;const s=st;st=null;const c=L.cur;
  if(s.txt){startText(s.i,s.p);return}
  if(s.o){
   if(s.o.t==='hl'&&(s.o.r[2]<.01||s.o.r[3]<.004)){drawAnn(s.i);return}
   addObj(s.i,s.o);
  }
 };
 rs.addEventListener('pointerup',end);rs.addEventListener('pointercancel',()=>{if(st){const s=st;st=null;drawAnn(s.i)}});
}
function eraseAt(s,e){
 if(!s)return;const r=s.ac.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,list=(L.cur.ann[s.i]||[]).slice();
 for(const o of list.reverse()){if(hit(s.i,o,px,py)){delObj(s.i,o);break}}
}
function startText(i,p){
 const c=L.cur,pg=q$(`#rs .pg[data-i="${i}"]`),W=pg.clientWidth,s=W/c.sizes[i].w,fs=TXT_S[c.size];
 pg.querySelectorAll('.ti').forEach(t=>t.blur());
 const t=document.createElement('textarea');t.className='ti';t.rows=1;t.setAttribute('aria-label','Text note');
 t.style.cssText=`left:${p[0]*W}px;top:${p[1]*pg.clientHeight}px;font-size:${fs*s}px;color:${c.color==='#ffd84d'?'#7a5a00':c.color}`;
 pg.append(t);t.focus();
 const grow=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px';t.cols=Math.max(10,Math.max(...t.value.split('\n').map(l=>l.length))+1)};
 t.oninput=grow;grow();
 let fin=false;
 const commit=()=>{if(fin)return;fin=true;const v=t.value.replace(/\s+$/,'');t.remove();if(v)addObj(i,{t:'tx',c:c.color,fs,x:p[0],y:p[1],s:v})};
 t.onblur=commit;t.onkeydown=e=>{if(e.key==='Escape'){t.value='';t.blur()}};
}

/* ── editing the PDF: rotate / delete a page ── */
async function persistBytes(){
 const c=L.cur;
 await idbPut('data',c.b.id,await encB(c.bytes));
 await openDoc();
 const cv=await coverOf(c.doc);c.b.cover=cv.thumb;c.b.aspect=cv.aspect;c.b.color=pickColor(cv.cv,c.b.title);
 c.b.size=c.bytes.byteLength;await saveMeta(c.b);await saveAnn();
}
function rotPt(o){ // rotate annotation 90° clockwise
 const f=([x,y])=>[1-y,x];
 if(o.t==='pen')o.p=o.p.map(f);
 else if(o.t==='hl'){const a=f([o.r[0],o.r[1]]),b=f([o.r[0]+o.r[2],o.r[1]+o.r[3]]);o.r=[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1])]}
 else if(o.t==='tx'){const a=f([o.x,o.y]);o.x=Math.max(0,Math.min(.9,a[0]-.15));o.y=Math.max(0,Math.min(.95,a[1]))}
}
async function pageOp(kind){
 const c=L.cur,i=curPage()-1;closeMenu();
 msg(kind==='rot'?'Rotating page '+(i+1)+'…':'Deleting page '+(i+1)+'…',20000);
 try{
  const pdf=await PDFLib.PDFDocument.load(c.bytes,{ignoreEncryption:true});
  if(kind==='rot'){const p=pdf.getPage(i);p.setRotation(PDFLib.degrees((p.getRotation().angle+90)%360));(c.ann[i]||[]).forEach(rotPt)}
  else{
   if(pdf.getPageCount()<2){msg('A book needs at least one page');return}
   pdf.removePage(i);delete c.ann[i];
   const n={};for(const k of Object.keys(c.ann)){const j=+k;n[j>i?j-1:j]=c.ann[k]}c.ann=n;
  }
  c.bytes=new Uint8Array(await pdf.save());c.undo=[];c.redo=[];
  await persistBytes();
  const keep=Math.min(i,c.doc.numPages-1);
  drawReader();goPage(keep+1);
 }catch(e){msg('That edit failed: '+(e.message||e),5000)}
 document.querySelectorAll('.msg').forEach(m=>{if(/^(Rotating|Deleting)/.test(m.textContent))m.remove()});
}

/* ── export: burn annotations into a new PDF ── */
function hexRgb(h){const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)}
function toUser(page,u,v){
 const {width:W,height:H}=page.getSize(),r=((page.getRotation().angle%360)+360)%360;
 const dw=r%180?H:W,dh=r%180?W:H,dx=u*dw,dy=v*dh;
 if(r===90)return[dy,dx];if(r===180)return[W-dx,dy];if(r===270)return[W-dy,H-dx];
 return[dx,H-dy];
}
async function textPng(o,scale){
 const cv=document.createElement('canvas'),cx=cv.getContext('2d'),f=o.fs*scale,font=`${f}px -apple-system,"Segoe UI",system-ui,sans-serif`;
 cx.font=font;const ls=o.s.split('\n'),w=Math.ceil(Math.max(...ls.map(l=>cx.measureText(l).width)))+4,h=Math.ceil(ls.length*f*1.2)+4;
 cv.width=w;cv.height=h;cx.font=font;cx.fillStyle=o.c;cx.textBaseline='top';ls.forEach((l,k)=>cx.fillText(l,2,2+k*f*1.2));
 const bl=await new Promise(r=>cv.toBlob(r,'image/png'));return{png:new Uint8Array(await bl.arrayBuffer()),w:w/scale,h:h/scale};
}
async function buildExport(){
 const c=L.cur,pdf=await PDFLib.PDFDocument.load(c.bytes,{ignoreEncryption:true}),pages=pdf.getPages();
 for(const k of Object.keys(c.ann)){
  const i=+k,page=pages[i];if(!page)continue;
  const {width:W,height:H}=page.getSize(),r=((page.getRotation().angle%360)+360)%360,dw=r%180?H:W,dh=r%180?W:H;
  for(const o of c.ann[k]){
   if(o.t==='hl'){
    const a=toUser(page,o.r[0],o.r[1]),b=toUser(page,o.r[0]+o.r[2],o.r[1]+o.r[3]);
    page.drawRectangle({x:Math.min(a[0],b[0]),y:Math.min(a[1],b[1]),width:Math.abs(a[0]-b[0]),height:Math.abs(a[1]-b[1]),color:hexRgb(o.c),opacity:.38,blendMode:PDFLib.BlendMode.Multiply});
   }else if(o.t==='pen'){
    const P=o.p.map(p=>toUser(page,p[0],p[1])),col=hexRgb(o.c);
    if(P.length===1)P.push([P[0][0]+.01,P[0][1]]);
    for(let j=1;j<P.length;j++)page.drawLine({start:{x:P[j-1][0],y:P[j-1][1]},end:{x:P[j][0],y:P[j][1]},thickness:o.w,color:col,lineCap:PDFLib.LineCapStyle.Round});
   }else if(o.t==='tx'){
    const img=await textPng(o,3),png=await pdf.embedPng(img.png);
    // anchor = top-left of the text box on the displayed page
    const a=toUser(page,o.x,o.y);
    let opts={width:img.w,height:img.h};
    if(r===0){opts.x=a[0];opts.y=a[1]-img.h}
    else if(r===90){opts.x=a[0]+img.h;opts.y=a[1];opts.rotate=PDFLib.degrees(90)}
    else if(r===180){opts.x=a[0];opts.y=a[1]+img.h;opts.rotate=PDFLib.degrees(180)}
    else{opts.x=a[0]-img.h;opts.y=a[1];opts.rotate=PDFLib.degrees(270)}
    page.drawImage(png,opts);
   }
  }
 }
 return new Uint8Array(await pdf.save());
}
async function deliver(bytes,name){
 const file=new File([bytes],name,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}

/* ── head: front-facing, big anime eyes ── */

 <g data-r="open${side}">

  <path d="M -11.2 -3 C -10.6 -12.4 -3 -15 4 -14.8 C 9.5 -14.4 12.2 -9.6 12.6 -4.4" fill="none" stroke="${INK}" stroke-width="2.9" stroke-linecap="round"/>
  <path d="M ${side==='L'?'-11.2 -3 L -14.4 -5.6':'12.6 -4.4 L 15.8 -7'}" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
 </g>
 <path data-r="happy${side}" d="M -10 3 C -6 -8 6 -8 10 3" fill="none" stroke="${INK}" stroke-width="2.7" stroke-linecap="round" display="none"/>
 <path data-r="sleep${side}" d="M -10 -3 C -6 6 6 6 10 -3" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round" display="none"/>
</g>`;}
const ear=(s)=>{const m=s; return `
<g data-r="ear${s<0?'L':'R'}">
 <path d="M ${m*37} -20 C ${m*42} -38 ${m*42} -53 ${m*39} -63 C ${m*29} -57 ${m*17} -46 ${m*9} -33 Z" fill="url(#cg-head)" ${st(1.6)}/>
 <path d="M ${m*33} -26 C ${m*35.5} -38 ${m*36} -48 ${m*34.5} -55 C ${m*28} -50 ${m*21} -43 ${m*15.5} -35 Z" fill="url(#cg-ear)"/>
 <path d="M ${m*33} -28 C ${m*30} -34 ${m*27} -38 ${m*23} -40 M ${m*31} -24 C ${m*27} -30 ${m*23} -33 ${m*19} -34" fill="none" stroke="#ffe3ea" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
</g>`;};
const head=`
<g data-r="head">
 ${ear(-1)}${ear(1)}
 <path d="M -39 -8 C -40 -28 -24 -38 0 -38 C 24 -38 40 -28 39 -8 L 46 -3 L 39 3 L 45 10 L 36 13 C 30 25 16 29 0 29 C -16 29 -30 25 -36 13 L -45 10 L -39 3 L -46 -3 Z" fill="url(#cg-head)" ${st(1.6)}/>
 <path d="M -9 -37 L -5 -30 L -1 -37 L 3 -30 L 7 -37" fill="none" stroke="${LN2}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
 <ellipse cx="-27" cy="8" rx="7.5" ry="4" fill="#ffb3c5" opacity=".5"/><ellipse cx="27" cy="8" rx="7.5" ry="4" fill="#ffb3c5" opacity=".5"/>
 ${eye(-19,'L')}${eye(19,'R')}
 <path d="M -3.3 8.6 L 3.3 8.6 L 0 12.8 Z" fill="#ff8fa9" stroke="#e5698b" stroke-width=".9" stroke-linejoin="round"/>
 <path data-r="mouth" d="M 0 12.8 L 0 15.4 M 0 15.4 C -2 19 -7 19 -9 15.8 M 0 15.4 C 2 19 7 19 9 15.8" fill="none" stroke="#8a6a86" stroke-width="1.3" stroke-linecap="round"/>
 <g data-r="mouthO" display="none"><ellipse cx="0" cy="19" rx="5.4" ry="4.4" fill="#7a3550"/><ellipse data-r="tongue" cx="0" cy="21" rx="3.6" ry="2.2" fill="#ff8fa9"/></g>
 <g stroke="#c9d3e8" stroke-width="1" stroke-linecap="round" fill="none" opacity=".9">
  <path d="M -27 9 L -66 3 M -27 12 L -68 12 M -26 15 L -63 21"/><path d="M 27 9 L 66 3 M 27 12 L 68 12 M 26 15 L 63 21"/></g>
</g>`;

/* ── poses ── */
const tailStroke=(d,wo=15,wi=12.6)=>`<path d="${d}" fill="none" stroke="${LN}" stroke-width="${wo}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fdfdff" stroke-width="${wi}" stroke-linecap="round"/>`;
const limb=(fill,line,g,extra='')=>`<path d="${fill}" fill="url(#${g})" ${extra}/><path d="${line}" fill="none" ${st(1.7)}/>`;

const stand=`
<g data-r="stand">
 <g data-r="legHF"><g transform="translate(24 -2)">${limb(HL_FILL,HL_LINE,'cg-far')}</g></g>
 <g data-r="legFF"><g transform="translate(-20 -2)">${limb(FL_FILL,FL_LINE,'cg-far')}</g></g>
 <g data-r="upper">
  <g data-r="tailS">${tailStroke(TAIL_S)}</g>
  <g transform="translate(0 -8)">
   <path d="${TORSO}" fill="url(#cg-body)" ${st(1.8)}/>
   <g clip-path="url(#cg-clip-torso)">
    <path d="M -140 -76 C -90 -68 -30 -74 30 -71 C 70 -69 100 -74 120 -82 L 120 -30 L -140 -30 Z" fill="#e8edf8"/>
    <path d="M 56 -112 C 70 -100 74 -84 70 -64 L 120 -62 L 120 -124 Z" fill="#eef2fa"/>
   </g>
   <path d="M -50 -96 C -38 -82 -44 -64 -62 -56" fill="none" stroke="${LN2}" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
   <path d="M 92 -72 L 83 -68 L 91 -63 L 82 -58 L 89 -54" fill="none" stroke="${LN2}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  </g>
 </g>
 <g data-r="legHN">${limb(HL_FILL,HL_LINE,'cg-leg')}</g>
 <g data-r="legFN">${limb(FL_FILL,FL_LINE,'cg-leg')}</g>

const sit=`
<g data-r="sit">
 <g transform="translate(-18 0)">${limb(SIT_FL,'M 52 -60 C 51 -46 54 -30 56 -14 C 54 -8 54 -2 60 2 L 82 2 C 90 2 90 -5 84 -7 C 79 -8 78 -14 78 -24','cg-far')}</g>
 <path d="${SIT_TORSO}" fill="url(#cg-body)" ${st(1.8)}/>
 <g clip-path="url(#cg-clip-sit)"><path d="M -140 -64 C -90 -50 -20 -70 40 -64 L 120 -52 L 120 10 L -140 10 Z" fill="#e8edf8"/></g>

 <path d="M -24 -2 C -24 -12 8 -14 28 -8 C 40 -4 38 5 26 5 L -18 5 Z" fill="url(#cg-leg)" ${st(1.6)}/>
 ${limb(SIT_FL,'M 50 -62 C 50 -48 54 -30 56 -14 C 54 -8 54 -2 60 2 L 82 2 C 90 2 90 -5 84 -7 C 79 -8 78 -14 78 -24 C 78 -42 80 -58 83 -72','cg-leg')}
 <g data-r="tailT">${tailStroke(SIT_TAIL)}</g>
 <g data-r="headSlotT" transform="translate(64 -134)"></g>

const curl=`
<g data-r="curl"><g data-r="breath">
 <path d="${CURL_BODY}" fill="url(#cg-body)" ${st(1.8)}/>
 <g clip-path="url(#cg-clip-curl)"><path d="M -110 -30 C -50 -22 40 -34 110 -26 L 110 10 L -110 10 Z" fill="#e8edf8"/></g>
 <path d="M -70 -52 C -48 -44 -44 -20 -62 -8" fill="none" stroke="${LN2}" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
 <g data-r="tailC">${tailStroke(CURL_TAIL)}</g>
 <g data-r="headSlotC" transform="translate(56 -32) rotate(-9) scale(.95)"></g>
 <ellipse cx="34" cy="-4" rx="15" ry="8" fill="url(#cg-leg)" ${st(1.6)}/><ellipse cx="62" cy="-3" rx="14" ry="7.5" fill="url(#cg-leg)" ${st(1.6)}/>

const body=`<ellipse data-r="shadow" cx="0" cy="3" rx="118" ry="13" fill="#000" opacity=".28"/>

/* ── rig ── */
function mount(g){
  g.innerHTML=body;
  const r={};g.querySelectorAll('[data-r]').forEach(n=>{r[n.dataset.r]=n});
  r.root=g;
  r.head=(()=>{const t=document.createElementNS('http://www.w3.org/2000/svg','g');t.innerHTML=head;const h=t.firstElementChild;h.querySelectorAll('[data-r]').forEach(n=>{r[n.dataset.r]=n});r.head=h;return h})();
  r.headSlotS.append(r.head);r._pose='';
  return r;
}
const rot=(a,x,y)=>`rotate(${a.toFixed(2)} ${x} ${y})`;
function legT(px,py,ang,lift,sy){return `translate(0 ${(-lift).toFixed(2)}) translate(${px} ${py}) rotate(${ang.toFixed(2)}) scale(1 ${sy.toFixed(3)}) translate(${-px} ${-py})`}

/* p: pose 'stand'|'sit'|'curl', face ±1, gait (rad), walk 0..1, gallop 0..1, crouch 0..1, leap 0..1,
   pitch (deg), headX/headY, headRot, lookX/lookY (-1..1), eyes 'open'|'happy'|'sleep', blink 0..1, half 0..1,
   round 0..1 (pupil size), earL/earR deg, tail deg, breath 0..1, mouth 0..1, tongue 0..1, bob px */
function apply(r,p){
  const pose=p.pose||'stand';
  if(r._pose!==pose){
    r.stand.style.display=pose==='stand'?'':'none';r.sit.style.display=pose==='sit'?'':'none';r.curl.style.display=pose==='curl'?'':'none';
    (pose==='stand'?r.headSlotS:pose==='sit'?r.headSlotT:r.headSlotC).append(r.head);
    r._pose=pose;
  }
  r.flip.setAttribute('transform',`scale(${p.face||1} 1)`);
  r.shadow.setAttribute('rx',pose==='stand'?122:pose==='sit'?84:104);
  r.shadow.setAttribute('cx',pose==='stand'?0:pose==='sit'?4:4);
  const ph=p.gait||0,A=(26+14*(p.gallop||0))*(p.walk||0),c=p.crouch||0,lp=p.leap||0;
  const ex=(x)=>x*(1);
  if(pose==='stand'){
    const s=Math.sin(ph),k=Math.cos(ph),W=p.walk||0;
    const sy=1-.26*c,pitch=p.pitch||0;
    r.legFN.setAttribute('transform',legT(62,-92,A*s-pitch*.9-46*lp,Math.max(0,-k)*7*W,sy));
    r.legFF.setAttribute('transform',legT(42,-92,-A*s-pitch*.9-34*lp,Math.max(0,k)*7*W,sy));
    r.legHN.setAttribute('transform',legT(-90,-88,-A*s+36*lp,Math.max(0,k)*7*W,sy));
    r.legHF.setAttribute('transform',legT(-66,-88,A*s+28*lp,Math.max(0,-k)*7*W,sy));
    const bob=(p.bob!==undefined?p.bob:-Math.abs(Math.sin(ph))*2.4*W);
    const ut=`translate(0 ${(bob+17*c).toFixed(2)}) ${rot((pitch+4*c+9*lp),-85,-78)}`;
    r.upper.setAttribute('transform',ut);
    r.tailS.setAttribute('transform',rot(p.tail||0,-104,-92));
    r.headSlotS.setAttribute('transform',`${ut} translate(${96+(p.headX||0)} ${-112+(p.headY||0)}) rotate(${(p.headRot||0).toFixed(2)})`);
  }else if(pose==='sit'){
    r.tailT.setAttribute('transform',rot((p.tail||0)*.7,-96,-12));
    r.headSlotT.setAttribute('transform',`translate(${64+(p.headX||0)} ${-134+(p.headY||0)}) rotate(${(p.headRot||0).toFixed(2)})`);
  }else{
    const b=p.breath||0;
    r.breath.setAttribute('transform',`translate(0 ${(-b*1.5).toFixed(2)}) scale(1 ${(1+b*.035).toFixed(4)})`);
    r.tailC.setAttribute('transform',rot((p.tail||0)*.5,-84,-8));
    r.headSlotC.setAttribute('transform',`translate(${56+(p.headX||0)} ${-32+(p.headY||0)}) rotate(${(-9+(p.headRot||0)).toFixed(2)}) scale(.95)`);
  }
  /* eyes */
  const mode=p.eyes||'open',blink=Math.min(1,Math.max(p.blink||0,p.half?p.half*.55:0)),k=Math.max(.07,1-blink);
  for(const s of ['L','R']){
    r['open'+s].setAttribute('display',mode==='open'?'':'none');
    r['happy'+s].setAttribute('display',mode==='happy'?'':'none');
    r['sleep'+s].setAttribute('display',mode==='sleep'?'':'none');
    r['open'+s].setAttribute('transform',`translate(0 -12) scale(1 ${k.toFixed(3)}) translate(0 12)`);
    const pu=r['pupil'+s],lx=(p.lookX||0)*3,ly=(p.lookY||0)*2.6,rd=p.round||0;
    pu.setAttribute('rx',(3.4+rd*4.6).toFixed(2));pu.setAttribute('ry',(8.8+rd*1.6).toFixed(2));
    pu.setAttribute('transform',`translate(${lx.toFixed(2)} ${ly.toFixed(2)})`);
  }
  r.earL.setAttribute('transform',rot(p.earL||0,-24,-28));
  r.earR.setAttribute('transform',rot(p.earR||0,24,-28));
  const mo=p.mouth||0;
  r.mouth.setAttribute('display',mo>0.05?'none':'');
  r.mouthO.setAttribute('display',mo>0.05?'':'none');
  if(mo>0.05){r.mouthO.setAttribute('transform',`translate(0 19) scale(${(.55+mo*.45).toFixed(2)} ${(.35+mo*.65).toFixed(2)}) translate(0 -19)`)}
  r.tongue.setAttribute('display',(p.tongue||0)>0.05?'':'none');
  r.head.setAttribute('transform',`rotate(${(0).toFixed(1)})`);
}
return{defs,mount,apply};
})();

(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg',KEY='fv-relax';
const BED={x:104,y:488},BOWL={x:322,y:456};
const X0=50,X1=366,Y0=402,Y1=532;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const q$=(s,r=document)=>r.querySelector(s);
const sc=y=>.46+(y-400)*.0009;
const FOOD={kibble:{full:26,joy:3,label:'Kibble'},fish:{full:34,joy:12,label:'Fish'}};

  let d={};try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
  const n=Date.now(),o={full:70,energy:85,joy:60,food:0,kind:'kibble',t:n,meals:0,plays:0,naps:0,snd:false,...d};

  if(C.st==='sleep'||C.st==='settle'){if(S.full<60)wake();else note('Mochi will eat when she wakes')}
  if(C.st==='idle'||C.st==='walk'&&C.then!==beginEat){if(S.full<86){goto(BOWL.x-66,BOWL.y+2,beginEat,70);say('mrrp!',1.2)}else note('Mochi is full – she will eat later')}}
function toggleBed(){if(C.st==='sleep'||C.st==='settle'){wake();return}if(D.show){D.show=false}C.bedReq=true;if(C.st==='idle'||C.st==='walk'||C.st==='chase'||C.st==='stalk'){goto(BED.x,BED.y-5,beginSettle,66);C.bedReq=false}}
function laser(){D.show=!D.show;if(D.show){D.x=clamp(C.x+(C.face||1)*130,X0,X1);D.y=clamp(C.y+4,Y0,Y1);D.last=R.time;D.vel=0;note('Drag on the floor to move the laser');if(C.st==='sleep'&&S.energy>45){wake()}if(C.st==='idle'&&S.energy>12)decide()}else if(C.st==='chase'||C.st==='stalk')idle(1.2)}

/* ───── open / close ───── */
function openRelax(){
  if(R.open)return;S=load();
  let w=q$('#rx');if(w)w.remove();
  w=document.createElement('div');w.id='rx';w.className='web';w.setAttribute('role','dialog');w.setAttribute('aria-label','Relax');
  w.innerHTML=`<div class="tabs"><b style="padding:0 6px">Relax</b><span class="mute" id="rxmood"></span><span style="flex:1"></span><button class="ghost" data-r="close">Done</button></div>
  <div class="rxbars"><label>🍖<i><b id="rxb-full"></b></i><span>Full</span></label><label>⚡<i><b id="rxb-energy"></b></i><span>Energy</span></label><label>💗<i><b id="rxb-joy"></b></i><span>Joy</span></label></div>
  <div class="rxstage">${sceneSVG()}<div class="rxtoast" id="rxtoast" role="status" hidden></div></div>
  <div class="rxbar"><button class="ghost" data-r="kibble">🥣 Kibble</button><button class="ghost" data-r="fish">🐟 Fish</button><button class="ghost" data-r="laser" aria-pressed="false">🔴 Laser</button><button class="ghost" data-r="bed">🛏 Bed</button><button class="ghost" data-r="snd" aria-label="Purr sound">🔊 Purr</button></div>`;
  document.body.append(w);
  R.svg=q$('#rxs');R.fx=q$('#rxfx');R.cat=q$('#rxcat');R.refs=CatArt.mount(R.cat);
  R.svg.style.touchAction='none';
  R.svg.addEventListener('pointerdown',down);R.svg.addEventListener('pointermove',move);R.svg.addEventListener('pointerup',up);R.svg.addEventListener('pointercancel',up);
  Object.assign(C,{x:200,y:470,face:-1,st:'idle',t:0,wait:1,walk:0,gal:0,cr:0,lp:0,petT:0,hs:0,bedReq:false,then:null});D.show=false;P.length=0;
  drawFood();R.open=true;R.last=0;R.time=0;bubT=0;
  if(S.energy<20){C.x=BED.x;C.y=BED.y-5;C.st='sleep';C.t=0}
  bottom();stats();R.raf=requestAnimationFrame(loop);
}
function close(){
  if(!R.open&&!q$('#rx'))return;
  R.open=false;cancelAnimationFrame(R.raf);stopPurr();save();
  q$('#rx')?.remove();R.svg=R.cat=R.refs=R.fx=null;R.drag=null}
function bottom(){const n=q$('#rx');if(n)n.style.bottom=document.getElementById('hud')?'84px':'0'}
window.relaxOpen=openRelax;
window.relaxReset=close;window.relaxBottom=bottom;
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-r]');if(!b||!R.open&&b.dataset.r!=='open')return;
  switch(b.dataset.r){
   case 'open':openRelax();break;case 'close':close();break;
   case 'kibble':feed('kibble');break;case 'fish':feed('fish');break;
   case 'laser':laser();b.setAttribute('aria-pressed',D.show);break;case 'bed':toggleBed();break;
   case 'snd':S.snd=!S.snd;if(S.snd)purr(false);else stopPurr();save();note(S.snd?'Purr sound on – pet Mochi':'Purr sound off');break}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R.open)save()});
window.__relax={get S(){return S},C,D,R,step};
})();

</script>
