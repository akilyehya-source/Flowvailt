:root[data-theme="dark"]{--bg:#0d1117}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

.completed .blk{opacity:.6}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:15vh;z-index:9}

.tab{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--card);white-space:nowrap}.tab.on{border-color:var(--sig)}.tab button{background:none;border:0;padding:5px 9px}
.bar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.bar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--text);font:inherit}
.wbody{flex:1;min-height:0;overflow-y:auto}.wbody iframe{width:100%;height:100%;border:0;background:#fff}

 background:linear-gradient(90deg,var(--cd),var(--c) 22%,var(--cl) 48%,var(--c) 78%,var(--cd));color:var(--ink);border-radius:1px}

async function unlock(pw){
 let k;
 if(!vault){
  const salt=crypto.getRandomValues(new Uint8Array(16));k=await deriveKey(pw,salt);
  const verifier=await encryptData('flowvault:verifier:v1',k),items=[];
  for(const s of SEED){const e=await encryptData(JSON.stringify({username:s.u,password:s.p}),k);const tt=s.totp?await encryptData(s.totp,k):null;items.push({id:s.id,title:s.t,category:s.c,ct:e.ciphertext,iv:e.iv,url:s.url,tags:s.tags,tct:tt&&tt.ciphertext,tiv:tt&&tt.iv})}
  vault={salt:b64(salt),verifier,items};saveVault();
 }else{
  k=await deriveKey(pw,unb64(vault.salt));
  if(await decryptData(vault.verifier.ciphertext,vault.verifier.iv,k)!=='flowvault:verifier:v1')throw 0;
 }
 for(const i of vault.items)users[i.id]=JSON.parse(await decryptData(i.ct,i.iv,k)).username;
 let ch=0;for(const s of SEED){const i=vault.items.find(x=>x.id===s.id);if(s.totp&&i&&!i.tct){const e=await encryptData(s.totp,k);i.tct=e.ciphertext;i.tiv=e.iv;ch=1}}if(ch)saveVault();
 notes=[];for(const n of vault.notes||[]){try{notes.push({...JSON.parse(await decryptData(n.ct,n.iv,k)),id:n.id,at:n.at,block:n.block})}catch{}}
 key=k;last=Date.now();render();
}

async function copySecret(v,label){

async function clipWipe(){

function drawPalette(){
 let o=$('#ov');if(!palette){if(o)o.remove();return}
 const list=cmds().filter(c=>c.l.toLowerCase().includes(palette.q.toLowerCase()));
 if(!o){o=document.createElement('div');o.id='ov';o.className='overlay';document.body.append(o);

/* ── TOTP (RFC 6238, HMAC-SHA1 via Web Crypto) ── */
function b32(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const c of s.replace(/=+$/,'').toUpperCase())bits+=A.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)}
async function totp(secret,t=Date.now()){const c=Math.floor(t/30000),buf=new ArrayBuffer(8),dv=new DataView(buf);dv.setUint32(0,Math.floor(c/2**32));dv.setUint32(4,c>>>0);
 const k=await crypto.subtle.importKey('raw',b32(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[19]&15;
 return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,'0')}

async function launchWorkspace(id){

 b.ids.forEach((x,n)=>launch(x,n===0)); /* every tab opens synchronously, inside the click */

async function hudTick(){

}

/* ── colour + geometry of a book ── */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),l=(m+n)/2;let h=0,s=0;if(m!==n){const d=m-n;s=l>.5?d/(2-m-n):d/(m+n);h=m===r?(g-b)/d+(g<b?6:0):m===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}

}

function curPage(){
 const rs=RS();if(!rs)return 1;const pgs=rs.querySelectorAll('.pg'),mid=rs.scrollTop+rs.clientHeight*.3;
 let lo=0,hi=pgs.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(pgs[m].offsetTop<=mid)lo=m;else hi=m-1}
 return lo+1;
}
function updatePg(){const c=L.cur;if(!c)return;const p=curPage(),b=q$('#rpg');if(b)b.textContent=p+' / '+c.doc.numPages;return p}
let scrollT=0;
function onScroll(){
 const c=L.cur;if(!c)return;const p=updatePg();clearTimeout(scrollT);
 scrollT=setTimeout(()=>{if(L.cur===c&&c.b.page!==p){c.b.page=p;c.b.last=Date.now();saveMeta(c.b).catch(()=>{})}},700);
}
function goPage(p){const c=L.cur,rs=RS();p=Math.max(1,Math.min(c.doc.numPages,p));const t=q$(`#rs .pg[data-i="${p-1}"]`);if(t)rs.scrollTop=t.offsetTop-8}
function setZoom(z){
 const c=L.cur,rs=RS();z=Math.max(ZMIN,Math.min(ZMAX,Math.round(z*100)/100));if(z===c.zoom)return;
 const ratio=rs.scrollTop/Math.max(1,rs.scrollHeight);
 c.zoom=z;c.b.zoom=z;rs.style.setProperty('--pw',pageW()+'px');
 rs.scrollTop=ratio*rs.scrollHeight;rerenderAll();saveMeta(c.b).catch(()=>{});
}

/* ── annotations ──
   objects: {t:'pen',c,w,p:[[x,y]..]}  {t:'hl',c,r:[x,y,w,h]}  {t:'tx',c,fs,x,y,s}
   positions are 0..1 of the displayed page; widths and font sizes are PDF points. */
const PEN_W=[1.5,3,6],TXT_S=[11,15,22];
function drawAnn(i,live){
 const c=L.cur;if(!c)return;const pg=q$(`#rs .pg[data-i="${i}"]`);if(!pg)return;
 const pc=q$('.pc',pg),ac=q$('.ac',pg);if(!pc.width)return;
 if(ac.width!==pc.width||ac.height!==pc.height){ac.width=pc.width;ac.height=pc.height}
 const cx=ac.getContext('2d'),W=ac.width,H=ac.height,s=W/c.sizes[i].w;
 cx.clearRect(0,0,W,H);
 const list=(c.ann[i]||[]).concat(live?[live]:[]);
 for(const o of list){
  if(o.t==='hl'){cx.globalAlpha=.38;cx.fillStyle=o.c;cx.fillRect(o.r[0]*W,o.r[1]*H,o.r[2]*W,o.r[3]*H);cx.globalAlpha=1}
  else if(o.t==='pen'){cx.strokeStyle=o.c;cx.lineWidth=o.w*s;cx.lineCap=cx.lineJoin='round';cx.beginPath();const p=o.p;cx.moveTo(p[0][0]*W,p[0][1]*H);
   if(p.length===1)cx.lineTo(p[0][0]*W+.01,p[0][1]*H);
   for(let k=1;k<p.length-1;k++){const mx=(p[k][0]+p[k+1][0])/2*W,my=(p[k][1]+p[k+1][1])/2*H;cx.quadraticCurveTo(p[k][0]*W,p[k][1]*H,mx,my)}
   if(p.length>1)cx.lineTo(p.at(-1)[0]*W,p.at(-1)[1]*H);cx.stroke()}
  else if(o.t==='tx'){cx.fillStyle=o.c;cx.textBaseline='top';cx.font=`${o.fs*s}px -apple-system,"Segoe UI",system-ui,sans-serif`;o.s.split('\n').forEach((ln,k)=>cx.fillText(ln,o.x*W,o.y*H+k*o.fs*s*1.2))}
 }
}
function bbox(i,o){
 const c=L.cur,pg=q$(`#rs .pg[data-i="${i}"]`),W=pg.clientWidth,H=pg.clientHeight,s=W/c.sizes[i].w;
 if(o.t==='hl')return[o.r[0]*W,o.r[1]*H,o.r[2]*W,o.r[3]*H];
 if(o.t==='tx'){const ls=o.s.split('\n'),mw=Math.max(...ls.map(l=>l.length))*o.fs*s*.55;return[o.x*W,o.y*H,mw,ls.length*o.fs*s*1.2]}
 return null;
}
function hit(i,o,px,py){
 const pg=q$(`#rs .pg[data-i="${i}"]`),W=pg.clientWidth,H=pg.clientHeight,pad=10;
 if(o.t==='pen'){const r=pad+o.w*W/L.cur.sizes[i].w/2;for(let k=0;k<o.p.length;k++){const ax=o.p[k][0]*W,ay=o.p[k][1]*H;
   if(Math.hypot(ax-px,ay-py)<r)return true;
   if(k){const bx=o.p[k-1][0]*W,by=o.p[k-1][1]*H,dx=ax-bx,dy=ay-by,l2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((px-bx)*dx+(py-by)*dy)/l2));if(Math.hypot(bx+t*dx-px,by+t*dy-py)<r)return true}}
  return false}
 const b=bbox(i,o);return px>=b[0]-pad&&px<=b[0]+b[2]+pad&&py>=b[1]-pad&&py<=b[1]+b[3]+pad;
}
async function saveAnn(){
 const c=L.cur;if(!c||!key)return;
 try{await idbPut('ann',c.b.id,await encJ(c.ann))}catch{}
}
function pushAct(a){const c=L.cur;c.undo.push(a);if(c.undo.length>200)c.undo.shift();c.redo=[]}
function addObj(i,o){const c=L.cur;(c.ann[i]=c.ann[i]||[]).push(o);pushAct({k:'add',i,o});drawAnn(i);saveAnn()}
function delObj(i,o,record=true){const c=L.cur,l=c.ann[i]||[],at=l.indexOf(o);if(at<0)return;l.splice(at,1);if(!l.length)delete c.ann[i];if(record)pushAct({k:'del',i,o,at});drawAnn(i);saveAnn()}
function undo(){const c=L.cur,a=c.undo.pop();if(!a)return;
 if(a.k==='add'){const l=c.ann[a.i]||[],at=l.indexOf(a.o);if(at>=0){l.splice(at,1);if(!l.length)delete c.ann[a.i]}}
 else{(c.ann[a.i]=c.ann[a.i]||[]).splice(Math.min(a.at,(c.ann[a.i]||[]).length),0,a.o)}
 c.redo.push(a);drawAnn(a.i);saveAnn()}
function redo(){const c=L.cur,a=c.redo.pop();if(!a)return;
 if(a.k==='add'){(c.ann[a.i]=c.ann[a.i]||[]).push(a.o)}
 else{const l=c.ann[a.i]||[],at=l.indexOf(a.o);if(at>=0){l.splice(at,1);if(!l.length)delete c.ann[a.i]}}
 c.undo.push(a);drawAnn(a.i);saveAnn()}
function setTool(t){
 const c=L.cur,rs=RS();c.tool=t;
 document.querySelectorAll('#rd .tool').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 rs.classList.toggle('tool',t!=='hand');rs.classList.toggle('pen',L.penOnly);
}
function bindDraw(){
 const rs=RS();let st=null;
 const pos=(e,ac)=>{const r=ac.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};
 rs.addEventListener('pointerdown',e=>{
  const c=L.cur,ac=e.target.closest&&e.target.closest('.ac');if(!ac||c.tool==='hand')return;
  if(L.penOnly&&e.pointerType==='touch')return;
  const pg=ac.parentElement,i=+pg.dataset.i;
  if(e.target.classList&&e.target.classList.contains('ti'))return;
  e.preventDefault();ac.setPointerCapture(e.pointerId);
  const p=pos(e,ac);
  if(c.tool==='pen')st={i,o:{t:'pen',c:c.color,w:PEN_W[c.size],p:[p]},ac};
  else if(c.tool==='hl')st={i,o:{t:'hl',c:c.color,r:[p[0],p[1],0,0]},a:p,ac};
  else if(c.tool==='erase')st={i,ac,erased:false,rect:ac.getBoundingClientRect()};
  else if(c.tool==='text')st={i,ac,p,txt:true};
  if(st&&c.tool==='erase')eraseAt(st,e);
 });
 rs.addEventListener('pointermove',e=>{
  if(!st||st.txt)return;
  if(st.o&&st.o.t==='pen'){const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of (evs.length?evs:[e]))st.o.p.push(pos(ev,st.ac));drawAnn(st.i,st.o)}
  else if(st.o&&st.o.t==='hl'){const p=pos(e,st.ac);st.o.r=[Math.min(st.a[0],p[0]),Math.min(st.a[1],p[1]),Math.abs(p[0]-st.a[0]),Math.abs(p[1]-st.a[1])];drawAnn(st.i,st.o)}
  else if(L.cur.tool==='erase')eraseAt(st,e);
 });
 const end=e=>{
  if(!st)return;const s=st;st=null;const c=L.cur;
  if(s.txt){startText(s.i,s.p);return}
  if(s.o){
   if(s.o.t==='hl'&&(s.o.r[2]<.01||s.o.r[3]<.004)){drawAnn(s.i);return}
   addObj(s.i,s.o);
  }
 };
 rs.addEventListener('pointerup',end);rs.addEventListener('pointercancel',()=>{if(st){const s=st;st=null;drawAnn(s.i)}});
}
function eraseAt(s,e){
 if(!s)return;const r=s.ac.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,list=(L.cur.ann[s.i]||[]).slice();
 for(const o of list.reverse()){if(hit(s.i,o,px,py)){delObj(s.i,o);break}}
}
function startText(i,p){
 const c=L.cur,pg=q$(`#rs .pg[data-i="${i}"]`),W=pg.clientWidth,s=W/c.sizes[i].w,fs=TXT_S[c.size];
 pg.querySelectorAll('.ti').forEach(t=>t.blur());
 const t=document.createElement('textarea');t.className='ti';t.rows=1;t.setAttribute('aria-label','Text note');
 t.style.cssText=`left:${p[0]*W}px;top:${p[1]*pg.clientHeight}px;font-size:${fs*s}px;color:${c.color==='#ffd84d'?'#7a5a00':c.color}`;
 pg.append(t);t.focus();
 const grow=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px';t.cols=Math.max(10,Math.max(...t.value.split('\n').map(l=>l.length))+1)};
 t.oninput=grow;grow();
 let fin=false;
 const commit=()=>{if(fin)return;fin=true;const v=t.value.replace(/\s+$/,'');t.remove();if(v)addObj(i,{t:'tx',c:c.color,fs,x:p[0],y:p[1],s:v})};
 t.onblur=commit;t.onkeydown=e=>{if(e.key==='Escape'){t.value='';t.blur()}};
}

/* ── editing the PDF: rotate / delete a page ── */
async function persistBytes(){
 const c=L.cur;
 await idbPut('data',c.b.id,await encB(c.bytes));
 await openDoc();
 const cv=await coverOf(c.doc);c.b.cover=cv.thumb;c.b.aspect=cv.aspect;c.b.color=pickColor(cv.cv,c.b.title);
 c.b.size=c.bytes.byteLength;await saveMeta(c.b);await saveAnn();
}
function rotPt(o){ // rotate annotation 90° clockwise
 const f=([x,y])=>[1-y,x];
 if(o.t==='pen')o.p=o.p.map(f);
 else if(o.t==='hl'){const a=f([o.r[0],o.r[1]]),b=f([o.r[0]+o.r[2],o.r[1]+o.r[3]]);o.r=[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1])]}
 else if(o.t==='tx'){const a=f([o.x,o.y]);o.x=Math.max(0,Math.min(.9,a[0]-.15));o.y=Math.max(0,Math.min(.95,a[1]))}
}
async function pageOp(kind){
 const c=L.cur,i=curPage()-1;closeMenu();
 msg(kind==='rot'?'Rotating page '+(i+1)+'…':'Deleting page '+(i+1)+'…',20000);
 try{
  const pdf=await PDFLib.PDFDocument.load(c.bytes,{ignoreEncryption:true});
  if(kind==='rot'){const p=pdf.getPage(i);p.setRotation(PDFLib.degrees((p.getRotation().angle+90)%360));(c.ann[i]||[]).forEach(rotPt)}
  else{
   if(pdf.getPageCount()<2){msg('A book needs at least one page');return}
   pdf.removePage(i);delete c.ann[i];
   const n={};for(const k of Object.keys(c.ann)){const j=+k;n[j>i?j-1:j]=c.ann[k]}c.ann=n;
  }
  c.bytes=new Uint8Array(await pdf.save());c.undo=[];c.redo=[];
  await persistBytes();
  const keep=Math.min(i,c.doc.numPages-1);
  drawReader();goPage(keep+1);
 }catch(e){msg('That edit failed: '+(e.message||e),5000)}
 document.querySelectorAll('.msg').forEach(m=>{if(/^(Rotating|Deleting)/.test(m.textContent))m.remove()});
}

/* ── export: burn annotations into a new PDF ── */
function hexRgb(h){const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)}
function toUser(page,u,v){
 const {width:W,height:H}=page.getSize(),r=((page.getRotation().angle%360)+360)%360;
 const dw=r%180?H:W,dh=r%180?W:H,dx=u*dw,dy=v*dh;
 if(r===90)return[dy,dx];if(r===180)return[W-dx,dy];if(r===270)return[W-dy,H-dx];
 return[dx,H-dy];
}
async function textPng(o,scale){
 const cv=document.createElement('canvas'),cx=cv.getContext('2d'),f=o.fs*scale,font=`${f}px -apple-system,"Segoe UI",system-ui,sans-serif`;
 cx.font=font;const ls=o.s.split('\n'),w=Math.ceil(Math.max(...ls.map(l=>cx.measureText(l).width)))+4,h=Math.ceil(ls.length*f*1.2)+4;
 cv.width=w;cv.height=h;cx.font=font;cx.fillStyle=o.c;cx.textBaseline='top';ls.forEach((l,k)=>cx.fillText(l,2,2+k*f*1.2));
 const bl=await new Promise(r=>cv.toBlob(r,'image/png'));return{png:new Uint8Array(await bl.arrayBuffer()),w:w/scale,h:h/scale};
}
async function buildExport(){
 const c=L.cur,pdf=await PDFLib.PDFDocument.load(c.bytes,{ignoreEncryption:true}),pages=pdf.getPages();
 for(const k of Object.keys(c.ann)){
  const i=+k,page=pages[i];if(!page)continue;
  const {width:W,height:H}=page.getSize(),r=((page.getRotation().angle%360)+360)%360,dw=r%180?H:W,dh=r%180?W:H;
  for(const o of c.ann[k]){
   if(o.t==='hl'){
    const a=toUser(page,o.r[0],o.r[1]),b=toUser(page,o.r[0]+o.r[2],o.r[1]+o.r[3]);
    page.drawRectangle({x:Math.min(a[0],b[0]),y:Math.min(a[1],b[1]),width:Math.abs(a[0]-b[0]),height:Math.abs(a[1]-b[1]),color:hexRgb(o.c),opacity:.38,blendMode:PDFLib.BlendMode.Multiply});
   }else if(o.t==='pen'){
    const P=o.p.map(p=>toUser(page,p[0],p[1])),col=hexRgb(o.c);
    if(P.length===1)P.push([P[0][0]+.01,P[0][1]]);
    for(let j=1;j<P.length;j++)page.drawLine({start:{x:P[j-1][0],y:P[j-1][1]},end:{x:P[j][0],y:P[j][1]},thickness:o.w,color:col,lineCap:PDFLib.LineCapStyle.Round});
   }else if(o.t==='tx'){
    const img=await textPng(o,3),png=await pdf.embedPng(img.png);
    // anchor = top-left of the text box on the displayed page
    const a=toUser(page,o.x,o.y);
    let opts={width:img.w,height:img.h};
    if(r===0){opts.x=a[0];opts.y=a[1]-img.h}
    else if(r===90){opts.x=a[0]+img.h;opts.y=a[1];opts.rotate=PDFLib.degrees(90)}
    else if(r===180){opts.x=a[0];opts.y=a[1]+img.h;opts.rotate=PDFLib.degrees(180)}
    else{opts.x=a[0]-img.h;opts.y=a[1];opts.rotate=PDFLib.degrees(270)}
    page.drawImage(png,opts);
   }
  }
 }
 return new Uint8Array(await pdf.save());
}
async function deliver(bytes,name){
 const file=new File([bytes],name,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
const safeName=t=>(t.replace(/[\\/:*?"<>|]+/g,' ').trim()||'book').slice(0,80);
async function exportCurrent(){
 const c=L.cur;closeMenu();msg('Preparing your PDF…',15000);
 try{const bytes=await buildExport();await deliver(bytes,safeName(c.b.title)+(Object.keys(c.ann).length?' (annotated)':'')+'.pdf')}
 catch(e){msg('Export failed: '+(e.message||e),5000)}
 document.querySelectorAll('.msg').forEach(m=>{if(/^Preparing/.test(m.textContent))m.remove()});
}

/* ── search inside a book ── */
async function pageText(i){const c=L.cur;if(c.text[i]!==undefined)return c.text[i];const p=await c.doc.getPage(i+1),t=await p.getTextContent();return c.text[i]=t.items.map(x=>x.str).join(' ').replace(/\s+/g,' ')}
async function runSearch(qs){
 const c=L.cur,tok=++c.sTok2||(c.sTok2=1),out=q$('#rsl'),n=c.doc.numPages,ql=qs.toLowerCase();c.sTok2=tok;
 out.innerHTML='';let found=0;const st=q$('#rsst');
 for(let i=0;i<n&&found<80;i++){
  if(c.sTok2!==tok||L.cur!==c)return;
  if(st)st.textContent='Searching… '+(i+1)+' / '+n;
  const t=await pageText(i),at=t.toLowerCase().indexOf(ql);
  if(at>=0){found++;const s=Math.max(0,at-35),sn=(s?'…':'')+t.slice(s,at+ql.length+55)+'…';
   const li=document.createElement('li');li.innerHTML=`<button data-l="rhit" data-p="${i+1}"><b>p.${i+1}</b>${esc(sn)}</button>`;out.append(li)}
 }
 if(st)st.textContent=found?found+(found>=80?'+':'')+' pages match':'No matches. Scanned PDFs without a text layer cannot be searched.';
}
function toggleSearch(){
 const w=q$('#rd'),ex=q$('.rsrch',w);if(ex){ex.remove();return}
 const d=document.createElement('div');d.className='rsrch';
 d.innerHTML='<form id="rsf"><input id="rsq" placeholder="Search this book" aria-label="Search this book" autocomplete="off"><button class="btn">Find</button><button type="button" class="ghost" data-l="rsearch">Close</button></form><div class="mute" id="rsst" style="padding:0 12px 6px"></div><ul id="rsl"></ul>';
 w.append(d);q$('#rsq',d).focus();
 q$('#rsf',d).onsubmit=e=>{e.preventDefault();const v=q$('#rsq',d).value.trim();if(v)runSearch(v)};
}
function closeMenu(){const m=q$('#rd .rmenu');if(m)m.remove()}
function toggleMenu(){

function closeReader(){

 if(c){clearTimeout(scrollT);c.b.page=curPage();c.b.last=Date.now();c.sTok++;c.sTok2=-1;saveMeta(c.b).catch(()=>{});saveAnn();if(c.obs)c.obs.disconnect();try{c.doc.destroy()}catch{}}

/* ── events ── */
document.addEventListener('click',async e=>{
 const el=e.target.closest&&e.target.closest('[data-l]');if(!el||!key)return;
 const a=el.dataset.l;
 if(a==='open'){L.open=true;drawLib();try{if(navigator.storage&&navigator.storage.persist){L.persisted=await navigator.storage.persist();fillLib()}}catch{}if(!L.loaded){L.loaded=true;try{await loadBooks();fillLib()}catch{}}}
 else if(a==='lclose'){L.open=false;closeDetail();drawLib()}
 else if(a==='bopen'){el.classList.add('pull');setTimeout(()=>{el.classList.remove('pull');showDetail(el.dataset.id)},240)}
 else if(a==='bclose')closeDetail();
 else if(a==='bread'){const id=L.detail&&L.detail.id;if(id)openBook(id)}
 else if(a==='bexport'){const b=L.books.find(x=>x.id===(L.detail&&L.detail.id));if(!b)return;try{const rec=await idbGet('data',b.id);await deliver(new Uint8Array(await decB(rec)),safeName(b.title)+'.pdf')}catch(err){msg('Could not export: '+(err.message||err),4000)}}
 else if(a==='bdel'){const d=L.detail;if(!d)return;if(!d.confirm){d.confirm=true;el.textContent='Tap again to delete';return}
  await idbDel(d.id);L.books=L.books.filter(b=>b.id!==d.id);closeDetail();fillLib();msg('Book deleted')}
 else if(a==='rclose')closeReader();
 else if(a==='tool')setTool(el.dataset.t);
 else if(a==='color'){L.cur.color=el.dataset.c;document.querySelectorAll('#rd .sw').forEach(s=>s.classList.toggle('on',s===el))}
 else if(a==='undo')undo();else if(a==='redo')redo();
 else if(a==='zin')setZoom(L.cur.zoom+.25);else if(a==='zout')setZoom(L.cur.zoom-.25);
 else if(a==='rsearch')toggleSearch();
 else if(a==='rhit'){goPage(+el.dataset.p);const s=q$('#rd .rsrch');if(s&&innerWidth<760)s.remove()}
 else if(a==='rmore')toggleMenu();
 else if(a==='mrot')pageOp('rot');else if(a==='mdel'){if(confirm('Delete this page from the book?'))pageOp('del');else closeMenu()}
 else if(a==='minv'){L.inv=!L.inv;RS().classList.toggle('inv',L.inv);closeMenu()}
 else if(a==='mpen'){L.penOnly=!L.penOnly;setTool(L.cur.tool);closeMenu()}
 else if(a==='mexp')exportCurrent();
 else if(a==='rgoto'){const w=q$('#rd'),ex=q$('.rgo',w);if(ex){ex.remove();return}
  const g=document.createElement('form');g.className='rgo';g.innerHTML=`<input type="number" inputmode="numeric" min="1" max="${L.cur.doc.numPages}" placeholder="Page" aria-label="Go to page"><button class="btn">Go</button>`;
  w.insertBefore(g,w.children[2]);q$('input',g).focus();g.onsubmit=ev=>{ev.preventDefault();const v=+q$('input',g).value;if(v)goPage(v);g.remove()}}
});
document.addEventListener('change',e=>{
 if(e.target.id==='lfile'){addFiles(e.target.files).finally(()=>{e.target.value=''})}
 else if(e.target.id==='lsort'){L.sort=e.target.value;fillLib()}
 else if(e.target.id==='rsize'){L.cur.size=+e.target.value}
});
document.addEventListener('input',e=>{if(e.target.id==='lq'){L.q=e.target.value;fillLib()}});
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(L.open&&!L.cur)fillLib();const c=L.cur;if(c&&RS()){RS().style.setProperty('--pw',pageW()+'px');rerenderAll()}},200)});
document.addEventListener('keydown',e=>{
 const c=L.cur;if(!c||!key)return;
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!/TEXTAREA|INPUT/.test(e.target.tagName)){e.preventDefault();e.shiftKey?redo():undo()}
});
/* hooks the main app calls */
window.libReset=()=>{L.open=false;L.books=[];L.loaded=false;L.detail=null;const c=L.cur;if(c){c.sTok++;c.sTok2=-1;try{c.obs&&c.obs.disconnect();c.doc&&c.doc.destroy()}catch{}}L.cur=null;for(const s of ['#lib','#rd','.msg'])document.querySelectorAll(s).forEach(n=>n.remove())};
window.libBottom=()=>{for(const s of ['#lib','#rd']){const n=q$(s);if(n)n.style.bottom=session?'84px':'0'}};
window.libOpen=()=>{if(key)document.querySelector('[data-l="open"]')?.click()};
window.__lib=L;
})();
</script>
